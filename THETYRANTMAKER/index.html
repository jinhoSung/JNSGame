<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tyrant Maker: Reborn</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .retro-btn {
      background-color: #e2d5c0; border: 4px solid #8b5a2b; border-style: outset;
      padding: 1rem; font-weight: bold; text-align: center; display: flex; flex-direction: column;
      align-items: center; justify-content: center; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s; color: #332211; cursor: pointer;
    }
    .retro-btn:active { transform: translate(4px, 4px); box-shadow: none; border-style: inset; }
    .retro-btn:hover { background-color: #f4e8d4; }
    .retro-btn:disabled { filter: grayscale(100%) opacity(0.5); cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4); border-style: outset; }

    .retro-btn-dark {
      background-color: #8b5a2b; color: #f4e8d4; border: 4px solid #5a3a1b; border-style: outset;
      padding: 1rem; font-weight: bold; text-align: center; display: flex; flex-direction: column;
      align-items: center; justify-content: center; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s; cursor: pointer;
    }
    .retro-btn-dark:active { transform: translate(4px, 4px); box-shadow: none; border-style: inset; }
    .retro-btn-dark:hover { background-color: #a66c33; }
    .retro-btn-dark:disabled { filter: grayscale(100%) opacity(0.5); cursor: not-allowed; }

    .retro-list-btn {
      width: 100%; text-align: left; background-color: #e2d5c0; border: 3px solid #8b5a2b;
      padding: 0.75rem; font-weight: bold; box-shadow: 2px 2px 0 0 rgba(0,0,0,0.3);
      display: flex; flex-direction: column; transition: transform 0.1s, box-shadow 0.1s;
      color: #332211; cursor: pointer;
    }
    .retro-list-btn:active { transform: translate(2px, 2px); box-shadow: none; }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.2s ease-out forwards; }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); filter: hue-rotate(0deg); }
      10% { transform: translate(-3px, -4px) rotate(-2deg); filter: hue-rotate(-90deg) brightness(1.5) contrast(1.5); }
      20% { transform: translate(-6px, 0px) rotate(2deg); filter: hue-rotate(-90deg) brightness(1.5) contrast(1.5); }
      30% { transform: translate(6px, 4px) rotate(0deg); filter: hue-rotate(-90deg) brightness(1.5) contrast(1.5); }
      40% { transform: translate(2px, -2px) rotate(2deg); filter: hue-rotate(-90deg) brightness(1.5) contrast(1.5); }
      50% { transform: translate(-2px, 4px) rotate(-2deg); filter: hue-rotate(-90deg) brightness(1.5) contrast(1.5); }
      60% { transform: translate(-6px, 2px) rotate(0deg); filter: hue-rotate(0deg); }
      70% { transform: translate(6px, 2px) rotate(-2deg); }
      80% { transform: translate(-2px, -2px) rotate(2deg); }
      90% { transform: translate(2px, 4px) rotate(0deg); }
      100% { transform: translate(1px, -4px) rotate(-2deg); }
    }
    .anim-shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      color: #ef4444 !important; 
    }
  </style>
</head>
<body class="bg-[#1a1a1a]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_STATS = { intelligence: 15, technique: 10, strength: 5, balance: 8, stamina: 10 };

    const CHAPTERS = [
      { id: 1, name: "시 대회 예선", opponent: "신성초등학교(최도진)", power: 80, reward: 5000, duration: 6 },
      { id: 2, name: "시 대회 결승", opponent: "북산초(도살장 군단)", power: 150, reward: 8000, duration: 5 },
      { id: 3, name: "화랑대기 결승", opponent: "대동초(전국 1위 송민재)", power: 250, reward: 15000, duration: 6 },
      { id: 4, name: "글로벌 유스 컵", opponent: "도르트문트 U-14", power: 380, reward: 25000, duration: 5 },
      { id: 5, name: "유스 컵 4강전", opponent: "바르셀로나 U-14(마테오)", power: 550, reward: 40000, duration: 5 },
      { id: 6, name: "네덜란드 2부 데뷔", opponent: "FC 덴 보스", power: 800, reward: 60000, duration: 6 },
      { id: 7, name: "더 클래식 (원정)", opponent: "로테르담 페예노르트", power: 1100, reward: 90000, duration: 4 },
      { id: 8, name: "U-17 월드컵", opponent: "프랑스 U-17 (줄리앙)", power: 1500, reward: 120000, duration: 6 },
      { id: 9, name: "EPL 개막전", opponent: "브라이튼 (텐백 수비)", power: 2000, reward: 180000, duration: 5 },
      { id: 10, name: "맨체스터 더비", opponent: "맨유(즐라탄)", power: 2600, reward: 250000, duration: 4 },
      { id: 11, name: "챔스 16강전", opponent: "파리 생제르맹(네이마르)", power: 3300, reward: 350000, duration: 5 },
      { id: 12, name: "카라바오 컵 결승", opponent: "아스널", power: 4000, reward: 500000, duration: 4 },
      { id: 13, name: "챔스 8강전", opponent: "레알 마드리드(크카모)", power: 5000, reward: 700000, duration: 5 },
      { id: 14, name: "러시아 월드컵 결승", opponent: "크로아티아(모드리크)", power: 6500, reward: 1000000, duration: 6 },
      { id: 15, name: "챔스 4강전", opponent: "바르셀로나(신계 마시)", power: 8500, reward: 1500000, duration: 4 },
      { id: 16, name: "챔스 결승 (최종장)", opponent: "로트문트(홀란도)", power: 11000, reward: 3000000, duration: 5 }
    ];

    const SKILLS_DB = [
      { id: 'phantom', name: "팬텀 턴 (A)", cost: 30000, bonus: 150, desc: "테크닉 기반 완벽한 탈압박" },
      { id: 'false9', name: "가짜 9번 (S)", cost: 80000, bonus: 400, desc: "전술적 뇌내 연산 극대화" },
      { id: 'tank', name: "휴먼 탱크 (SS)", cost: 200000, bonus: 1000, desc: "물리력으로 상대를 분쇄" },
      { id: 'brain', name: "뇌내 시뮬레이션 (SS)", cost: 500000, bonus: 2500, desc: "3초 앞의 미래를 선점" },
      { id: 'unbreakable', name: "강철의 육체 (EX)", cost: 1500000, bonus: 6000, desc: "부상 면역 및 질량 폭발" },
    ];

    const ITEMS_DB = [
      { id: 'energy', name: "구단 특제 피로회복제", cost: 15000, desc: "스트레스 -50 감소", type: 'stress', val: -50 },
      { id: 'protein', name: "고농축 텐텐 단백질", cost: 40000, desc: "근력 +5, 체력 +5 영구 상승", type: 'stats', stats: { strength: 5, stamina: 5 } },
      { id: 'video', name: "전술 분석 비디오", cost: 30000, desc: "축구 지능 +8 영구 상승", type: 'stats', stats: { intelligence: 8 } },
    ];

    const ACTIVITIES = {
      train_tactics: { id: 'train_tactics', name: "전술 훈련", int: 5, tech: 3, str: 0, bal: 0, stam: -1, strss: 10, gold: -500, rep: 0, icon: 'fas fa-brain' },
      train_tech: { id: 'train_tech', name: "개인기 훈련", int: 0, tech: 6, str: -1, bal: 2, stam: 0, strss: 12, gold: -800, rep: 0, icon: 'fas fa-shoe-prints' },
      train_physical: { id: 'train_physical', name: "웨이트", int: 0, tech: -1, str: 6, bal: 3, stam: 2, strss: 15, gold: -1000, rep: 0, icon: 'fas fa-dumbbell' },
      train_stamina: { id: 'train_stamina', name: "지옥 셔틀런", int: 0, tech: 0, str: 2, bal: 0, stam: 8, strss: 20, gold: 0, rep: 0, icon: 'fas fa-heartbeat' },
      alba_sponsor: { id: 'alba_sponsor', name: "스폰서 행사", int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: 25, gold: 12000, rep: 5, icon: 'fas fa-coins' },
      rest: { id: 'rest', name: "자유 휴식", int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: -60, gold: -1500, rep: 0, icon: 'fas fa-campground' },
    };

    const RANDOM_EVENTS = [
      { title: "한세희의 잔소리", desc: "매니저 한세희가 억지로 영양 식단을 먹이고 등짝을 때립니다.\n(스트레스 대폭 하락, 체력 소폭 상승)", effect: (s) => ({ ...s, stress: Math.max(0, s.stress - 30), stats: { ...s.stats, stamina: s.stats.stamina + 3 }}) },
      { title: "이예린의 서프라이즈", desc: "스폰서 이예린 전무가 예고 없이 찾아와 용돈을 쥐여주고 갑니다.\n(자금 20,000G 획득!)", effect: (s) => ({ ...s, money: s.money + 20000 }) },
      { title: "파파라치 출몰", desc: "훈련장 밖에서 파파라치의 카메라 플래시가 터집니다.\n(명성 50 상승, 스트레스 15 상승)", effect: (s) => ({ ...s, reputation: s.reputation + 50, stress: Math.min(100, s.stress + 15) }) },
      { title: "최현석의 지옥 특훈", desc: "LK 최현석 팀장이 나타나 코어 근육을 한계까지 짜냅니다.\n(근/밸런스 상승, 스트레스 대폭 상승)", effect: (s) => ({ ...s, stats: { ...s.stats, strength: s.stats.strength + 4, balance: s.stats.balance + 4 }, stress: Math.min(100, s.stress + 30) }) }
    ];

    const getRank = (val) => {
      if (val >= 300) return { r: 'SS', c: 'text-rose-600 bg-rose-100' };
      if (val >= 150) return { r: 'S', c: 'text-purple-600 bg-purple-100' };
      if (val >= 80) return { r: 'A', c: 'text-blue-600 bg-blue-100' };
      if (val >= 50) return { r: 'B', c: 'text-green-600 bg-green-100' };
      if (val >= 25) return { r: 'C', c: 'text-yellow-600 bg-yellow-100' };
      if (val >= 10) return { r: 'D', c: 'text-orange-600 bg-orange-100' };
      return { r: 'F', c: 'text-gray-600 bg-gray-200' };
    };

    const RetroFrame = ({ title, children, className = "" }) => (
      <div className={`bg-[#f4e8d4] border-[6px] border-[#8b5a2b] border-double shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] relative ${className}`}>
        {title && (
          <div className="absolute -top-4 left-4 bg-[#8b5a2b] text-[#f4e8d4] px-3 py-0.5 text-sm font-bold tracking-widest shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] z-20">
            {title}
          </div>
        )}
        <div className={`flex flex-col h-full w-full ${title ? "mt-2" : ""}`}>
          {children}
        </div>
      </div>
    );

    function Game() {
      const [view, setView] = useState('lobby'); 
      const [age, setAge] = useState(11);
      const [month, setMonth] = useState(3);
      const [money, setMoney] = useState(5000);
      const [reputation, setReputation] = useState(10);
      const [stress, setStress] = useState(0);
      const [stats, setStats] = useState(INITIAL_STATS);
      const [skills, setSkills] = useState(SKILLS_DB.map(s => ({...s, owned: false})));
      const [chapterIdx, setChapterIdx] = useState(0);
      const [deadline, setDeadline] = useState(CHAPTERS[0].duration); 
      
      const [logs, setLogs] = useState([]);
      const [scheduleQueue, setScheduleQueue] = useState([null, null, null, null]);
      
      const [matchHp, setMatchHp] = useState({ player: 100, playerMax: 100, enemy: 100, enemyMax: 100 });
      const [matchState, setMatchState] = useState({ active: false, turn: 1, pScore: 0, oScore: 0 });
      const [hitAnimTarget, setHitAnimTarget] = useState(null);

      const [modal, setModal] = useState({ isOpen: false, title: '', content: '', onClose: null });
      const [ending, setEnding] = useState(null); // 엔딩 상태 추가

      const currentChapter = CHAPTERS[chapterIdx] || CHAPTERS[CHAPTERS.length - 1];
      const logsEndRef = useRef(null);

      useEffect(() => {
        if (logsEndRef.current) logsEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, [logs]);

      const showModal = (title, content, onClose = null) => setModal({ isOpen: true, title, content, onClose });
      const closeModal = () => {
        const callback = modal.onClose;
        setModal({ isOpen: false, title: '', content: '', onClose: null });
        if (callback) callback();
      };

      const saveGame = () => {
        const saveData = { age, month, money, reputation, stress, stats, skills, chapterIdx, deadline };
        localStorage.setItem('tyrant_save_v3', JSON.stringify(saveData));
        showModal("시스템", "게임 진행 상황이 성공적으로 저장되었습니다.");
      };

      const loadGame = () => {
        const data = localStorage.getItem('tyrant_save_v3');
        if (data) {
          const p = JSON.parse(data);
          setAge(p.age); setMonth(p.month); setMoney(p.money);
          setReputation(p.reputation); setStress(p.stress);
          setStats(p.stats); setSkills(p.skills); setChapterIdx(p.chapterIdx);
          setDeadline(p.deadline || CHAPTERS[p.chapterIdx].duration);
          setEnding(null);
          setView('lobby');
          showModal("시스템", "저장된 데이터를 불러왔습니다.");
        } else showModal("오류", "저장된 데이터가 없습니다.");
      };

      const resetGame = () => {
        const confirmReset = () => {
            localStorage.removeItem('tyrant_save_v3');
            setAge(11); setMonth(3); setMoney(5000); setReputation(10); setStress(0);
            setStats(INITIAL_STATS); setSkills(SKILLS_DB.map(s => ({...s, owned: false}))); 
            setChapterIdx(0); setDeadline(CHAPTERS[0].duration);
            setEnding(null);
            setView('lobby');
        };

        if (ending) {
            confirmReset();
        } else {
            showModal("경고", "정말 처음(11세)부터 다시 시작하시겠습니까?\n모든 데이터가 삭제됩니다.", confirmReset);
        }
      };

      const getPlayerPower = () => {
        let basePower = Object.values(stats).reduce((a, b) => a + b, 0) * 6;
        let skillPower = skills.filter(s => s.owned).reduce((acc, curr) => acc + curr.bonus, 0);
        return basePower + skillPower;
      };

      const advanceTime = () => {
        if (month === 12) { setMonth(1); setAge(a => a + 1); } 
        else { setMonth(m => m + 1); }
      };

      const addToSchedule = (actId) => {
        const newQueue = [...scheduleQueue];
        const emptyIdx = newQueue.indexOf(null);
        if (emptyIdx !== -1) {
          newQueue[emptyIdx] = actId;
          setScheduleQueue(newQueue);
        } else showModal("안내", "이번 달 일정이 꽉 찼습니다!");
      };

      const removeFromSchedule = (index) => {
        const newQueue = [...scheduleQueue];
        newQueue[index] = null;
        setScheduleQueue(newQueue);
      };

      const clearSchedule = () => setScheduleQueue([null, null, null, null]);

      const executeSchedule = () => {
        if (scheduleQueue.includes(null)) {
          showModal("안내", "4주 차 일정을 모두 채워주세요!");
          return;
        }

        let s = { ...stats };
        let currStress = stress, currMoney = money, currRep = reputation;
        let summaryLog = `[${age}세 ${month}월 결산]\n\n`;
        let net = { int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: 0, gold: 0, rep: 0 };

        for (let i = 0; i < 4; i++) {
          const actKey = scheduleQueue[i];
          if (currStress >= 100 && actKey !== 'rest') {
            summaryLog += `${i + 1}주차: 스트레스 폭발로 쓰러짐! (병원비 2000G 소모)\n`;
            const oldStress = currStress; currStress = Math.max(0, currStress - 40); net.strss += (currStress - oldStress);
            const oldStam = s.stamina; s.stamina = Math.max(0, s.stamina - 2); net.stam += (s.stamina - oldStam);
            const oldStr = s.strength; s.strength = Math.max(0, s.strength - 2); net.str += (s.strength - oldStr);
            const oldMoney = currMoney; currMoney = Math.max(0, currMoney - 2000); net.gold += (currMoney - oldMoney);
            continue;
          }

          const act = ACTIVITIES[actKey];
          summaryLog += `${i + 1}주차: ${act.name}\n`;
          
          let earnedGold = act.gold;
          if (actKey === 'alba_sponsor') earnedGold = 12000 + (currRep * 50); 

          const oldInt = s.intelligence; s.intelligence = Math.max(0, s.intelligence + act.int); net.int += (s.intelligence - oldInt);
          const oldTech = s.technique; s.technique = Math.max(0, s.technique + act.tech); net.tech += (s.technique - oldTech);
          const oldStr = s.strength; s.strength = Math.max(0, s.strength + act.str); net.str += (s.strength - oldStr);
          const oldBal = s.balance; s.balance = Math.max(0, s.balance + act.bal); net.bal += (s.balance - oldBal);
          const oldStam = s.stamina; s.stamina = Math.max(0, s.stamina + act.stam); net.stam += (s.stamina - oldStam);
          
          const oldStress = currStress; currStress = Math.max(0, Math.min(100, currStress + act.strss)); net.strss += (currStress - oldStress);
          const oldMoney = currMoney; currMoney = Math.max(0, currMoney + earnedGold); net.gold += (currMoney - oldMoney);
          currRep += act.rep; net.rep += act.rep; 
        }

        summaryLog += `\n[월말 변동치]\n자금: ${net.gold > 0 ? '+'+net.gold.toLocaleString() : net.gold.toLocaleString()}G / 스트레스: ${net.strss > 0 ? '+'+net.strss : net.strss}`;

        const hasEvent = Math.random() < 0.3;
        
        showModal("스케줄 완료", summaryLog, () => {
            let finalState = { age, month, money: currMoney, reputation: currRep, stress: currStress, stats: s, skills, chapterIdx };
            
            const finalizeMonth = (st) => {
                setStats(st.stats); setStress(st.stress); setMoney(st.money); setReputation(st.reputation);
                setScheduleQueue([null, null, null, null]);
                advanceTime();
                
                if (deadline - 1 <= 0) {
                    showModal("출전 기한 만료", "더 이상 대회를 미룰 수 없습니다!\n강제로 전장에 투입됩니다.", () => {
                        startMatch(st.stats); 
                    });
                } else {
                    setDeadline(d => d - 1);
                    setView('lobby');
                }
            };

            if (hasEvent) {
                const event = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
                showModal("🚨 돌발 이벤트 발생!", `[${event.title}]\n\n${event.desc}`, () => {
                    finalizeMonth(event.effect(finalState));
                });
            } else {
                finalizeMonth(finalState);
            }
        });
      };

      const buySkill = (skill) => {
        if (money >= skill.cost) {
          setMoney(m => m - skill.cost);
          setSkills(skills.map(s => s.id === skill.id ? { ...s, owned: true } : s));
          showModal("구매 완료", `[${skill.name}] 특성을 획득했습니다!\n전투력이 대폭 상승합니다.`);
        } else showModal("잔액 부족", "자금이 부족합니다.");
      };

      const buyItem = (item) => {
        if (money >= item.cost) {
          setMoney(m => m - item.cost);
          if (item.type === 'stress') {
            setStress(s => Math.max(0, s + item.val));
            showModal("사용 완료", `${item.name}을 마셨습니다.\n스트레스가 크게 감소합니다.`);
          } else if (item.type === 'stats') {
            let newStats = { ...stats };
            for(let key in item.stats) { newStats[key] += item.stats[key]; }
            setStats(newStats);
            showModal("사용 완료", `${item.name}을 사용했습니다.\n영구적인 스탯 상승이 적용됩니다.`);
          }
        } else showModal("잔액 부족", "자금이 부족합니다.");
      };

      // --- 멀티 엔딩 판별 로직 ---
      const calculateEnding = (isWin) => {
        if (!isWin) {
            return {
                rank: 'F',
                title: '비운의 천재 (Bad Ending)',
                desc: '마지막 순간, 사이보그 홀란도의 압도적인 질량을 넘지 못하고 끔찍한 십자인대 파열 부상을 입었습니다. 회귀 전과 똑같은 절망을 맛보며 쓸쓸히 은퇴를 선언합니다...',
                color: 'text-gray-600 bg-gray-200'
            };
        }

        const totalStats = stats.intelligence + stats.technique + stats.strength + stats.balance + stats.stamina;

        if (reputation >= 3000 && totalStats >= 1000) {
            return {
                rank: 'SSS',
                title: '축구의 신 (God of Football)',
                desc: '펠레, 마라도나, 메시의 이름마저 완벽하게 지워버렸습니다. 인류 역사상 가장 완벽한 생물체이자 절대적인 축구의 신으로 등극하여 전 세계의 영원한 숭배를 받습니다.',
                color: 'text-yellow-600 bg-yellow-100 border-yellow-600'
            };
        }
        if (money >= 8000000) {
            return {
                rank: 'SS',
                title: '프리미어리그 구단주 (Billionaire)',
                desc: '그동안 쓸어 담은 천문학적인 부를 바탕으로 잉글랜드 명문 구단을 통째로 인수했습니다. LK그룹 이예린 부사장과 함께 유럽 축구계의 가장 강력한 지배자이자 구단주로 군림합니다.',
                color: 'text-purple-600 bg-purple-100 border-purple-600'
            };
        }
        if (stats.strength >= 150 && stats.stamina >= 150) {
            return {
                rank: 'S',
                title: '파괴신 (The Destroyer)',
                desc: '공보다 사람을 더 많이 날려버린 전설의 폭군. 유럽 수비수들 사이에서 당신의 이름은 마왕과도 같은 공포의 대명사로 남았습니다. 태클을 거는 자는 모두 병원 신세를 졌습니다.',
                color: 'text-red-600 bg-red-100 border-red-600'
            };
        }
        if (reputation >= 1500) {
            return {
                rank: 'A',
                title: '월드클래스 스트라이커',
                desc: '빅 이어를 들어 올리며 훌륭한 커리어를 완성했습니다. 한국을 넘어 아시아 역대 최고의 선수로 발롱도르 포디움에 오르며 수많은 유망주들의 우상이 되었습니다.',
                color: 'text-blue-600 bg-blue-100 border-blue-600'
            };
        }
        
        return {
            rank: 'B',
            title: '위대한 여정의 끝 (Normal Ending)',
            desc: '무사히 유럽 정벌을 마쳤습니다. 회귀의 기회를 살려 과거의 아쉬움을 모두 털어내고, 후회 없는 완벽한 축구 인생을 즐기며 평화로운 전설로 남았습니다.',
            color: 'text-green-600 bg-green-100 border-green-600'
        };
      };

      const startMatch = (overrideStats = null) => {
        setView('match');
        setHitAnimTarget(null);
        
        const activeStats = overrideStats || stats;
        const playerMax = 100 + (activeStats.stamina * 10);
        const enemyMax = 100 + Math.floor(currentChapter.power * 0.15);
        
        setMatchHp({ player: playerMax, playerMax, enemy: enemyMax, enemyMax });
        setMatchState({ active: true, turn: 1, pScore: 0, oScore: 0 });
        setLogs([
          `>> 챕터 ${currentChapter.id} : ${currentChapter.name}`,
          `적장 [ ${currentChapter.opponent} ] 이(가) 앞을 가로막습니다!`,
          "=====================================",
          "명령을 선택하십시오. (최대 5턴 진행)"
        ]);
      };

      const triggerHitAnimation = (target) => {
        setHitAnimTarget(target);
        setTimeout(() => setHitAnimTarget(null), 400); 
      };

      const handleMatchAction = (actionType) => {
        if(!matchState.active) return;
        let { turn, pScore, oScore } = matchState;
        let turnLog = `\n[ ${turn}번째 턴 - 폭군의 움직임 ]\n`;
        
        const oppActions = ['tackle', 'defense']; 
        const oppAct = oppActions[Math.floor(Math.random() * oppActions.length)];
        
        let pPower = 0; let oPower = currentChapter.power;

        if (actionType === 'attack') {
            pPower = (stats.strength * 10 + stats.balance * 5) * 2;
            turnLog += `>> 당신은 [강행돌파]로 정면을 들이받습니다!\n`;
            turnLog += `>> 적은 [${oppAct === 'tackle' ? '거친 태클' : '텐백 밀집 수비'}]로 대응합니다.\n`;
            if (oppAct === 'defense') { turnLog += `>> 💥 상성 우위! 압도적인 질량으로 뚫어버립니다!\n`; pPower *= 2.0; } 
            else { turnLog += `>> ⚔️ 정면 충돌! 순수 힘 싸움이 벌어집니다!\n`; }
        } 
        else if (actionType === 'pass') {
            pPower = (stats.intelligence * 10 + stats.technique * 5) * 2;
            turnLog += `>> 당신은 [전술패스]로 공간을 창출합니다!\n`;
            turnLog += `>> 적은 [${oppAct === 'tackle' ? '거친 태클' : '텐백 밀집 수비'}]로 대응합니다.\n`;
            if (oppAct === 'tackle') { turnLog += `>> ✨ 상성 우위! 거친 태클을 우아하게 회피합니다!\n`; pPower *= 2.0; } 
            else { turnLog += `>> ❌ 상성 열세! 촘촘한 수비벽에 막힙니다!\n`; oPower *= 1.5; }
        }
        else if (actionType === 'skill') {
            const ownedSkills = skills.filter(s => s.owned);
            if (ownedSkills.length > 0) {
                if (stress >= 80) { turnLog += `>> ⚠️ 극심한 스트레스로 특성 발동 실패!\n`; pPower = 0; } 
                else {
                    const usedSkill = ownedSkills[Math.floor(Math.random() * ownedSkills.length)];
                    turnLog += `>> 🔥 특성 개방! [ ${usedSkill.name} ] !!\n`;
                    pPower = getPlayerPower() * 2.5; 
                    setStress(s => Math.min(100, s + 15)); 
                }
            } else { turnLog += `>> 장착된 특성이 없어 아무 일도 일어나지 않았습니다.\n`; pPower = 0; }
        }

        if(Math.random() < 0.15 && pPower > 0) { turnLog += `>> ⚡ CRITICAL HIT! 폭군의 공격이 급소를 강타합니다!\n`; pPower *= 1.5; }
        if(Math.random() < 0.15 && oPower > 0) { turnLog += `>> ⚡ 적의 CRITICAL HIT! 상대의 공격이 뼈아프게 들어옵니다!\n`; oPower *= 1.5; }

        pPower += Math.floor(Math.random() * (pPower * 0.2));
        oPower += Math.floor(Math.random() * (oPower * 0.2));
        
        let damage = Math.max(15, Math.floor(Math.abs(pPower - oPower) * 0.05));
        if (damage > 80) damage = 80; 

        let isPlayerHit = false, isEnemyHit = false;

        if (pPower >= oPower) {
            turnLog += `>> 압도적인 무력! 적에게 ${damage}의 피해를 입혔습니다!\n`;
            isEnemyHit = true; triggerHitAnimation('enemy');
        } else {
            turnLog += `>> 상대의 역습! 방어벽이 뚫려 ${damage}의 피해를 입었습니다!\n`;
            isPlayerHit = true; triggerHitAnimation('player');
        }

        setLogs(prev => [...prev, turnLog]);
        
        let currentEnemyHp = Math.max(0, matchHp.enemy - (isEnemyHit ? damage : 0));
        let currentPlayerHp = Math.max(0, matchHp.player - (isPlayerHit ? damage : 0));

        setMatchHp(prev => ({ ...prev, enemy: currentEnemyHp, player: currentPlayerHp }));

        if (turn >= 5 || currentEnemyHp <= 0 || currentPlayerHp <= 0) {
            setMatchState({ active: false, turn: turn, pScore, oScore });
            setTimeout(() => finishMatch(currentEnemyHp, currentPlayerHp), 1000);
        } else {
            setMatchState({ active: true, turn: turn + 1, pScore, oScore });
            setLogs(prev => [...prev, "-------------------------------------", "다음 전술을 선택하십시오."]);
        }
      };

      const finishMatch = (finalEnemyHp, finalPlayerHp) => {
        let finalLog = `\n=====================================\n경기 종료!`;
        
        if (finalEnemyHp <= 0 || finalPlayerHp >= finalEnemyHp) {
          finalLog += `\n승부에서 이겼다! \n전리품으로 ${currentChapter.reward.toLocaleString()}G 를 획득했다!`;
          setMoney(m => m + currentChapter.reward); setReputation(r => r + 150); setStress(s => Math.max(0, s - 30)); 
          
          if (chapterIdx < CHAPTERS.length - 1) {
            finalLog += `\n\n[ 시스템 알림 ] 다음 스테이지가 개방되었습니다.`;
            setChapterIdx(c => c + 1);
            setDeadline(CHAPTERS[chapterIdx + 1].duration);
          } else {
            finalLog += `\n\n★ 모든 퀘스트를 완료했습니다! 최종 결산으로 이동합니다... ★`;
            setEnding(calculateEnding(true));
          }
        } else {
          finalLog += `\n마강철은 압도적인 질량 차이에 눈앞이 깜깜해졌다...`;
          setStress(s => Math.min(100, s + 40));

          if (chapterIdx === CHAPTERS.length - 1) {
            finalLog += `\n\n최종전에서 치명적인 내상을 입고 말았습니다. 시스템이 정지합니다...`;
            setEnding(calculateEnding(false));
          } else {
            finalLog += `\n능력치를 더 올리거나 새 특성을 장착해야 합니다.`;
          }
        }
        
        setLogs(prev => [...prev, finalLog, "END"]);
      };

      const getHpColor = (current, max) => {
        const ratio = current / max;
        if (ratio > 0.5) return 'bg-green-500';
        if (ratio > 0.2) return 'bg-yellow-400';
        return 'bg-red-500';
      };

      const getStressIcon = () => {
        if (stress >= 80) return <i className="fas fa-skull text-purple-700 animate-pulse text-5xl drop-shadow-md"></i>;
        if (stress >= 50) return <i className="fas fa-frown text-orange-600 text-5xl drop-shadow-md"></i>;
        return <i className="fas fa-smile text-green-600 text-5xl drop-shadow-md"></i>;
      };

      const StatRow = ({ label, value }) => {
        const rankInfo = getRank(value);
        return (
          <div className="flex justify-between items-center border-b border-gray-300 pb-1">
            <span>{label}</span> 
            <div className="flex items-center gap-2">
              <span className="font-mono text-base">{value}</span>
              <span className={`text-[10px] px-1.5 py-0.5 rounded font-black border border-current ${rankInfo.c}`}>{rankInfo.r}</span>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen text-[#332211] font-serif p-2 md:p-8 flex justify-center items-center selection:bg-[#8b5a2b] selection:text-white relative">
          
          {modal.isOpen && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="bg-[#f4e8d4] border-[6px] border-[#8b5a2b] border-double shadow-[10px_10px_0_0_rgba(0,0,0,0.8)] w-full max-w-md animate-pop">
                <div className="bg-[#8b5a2b] text-[#f4e8d4] px-4 py-2 font-bold tracking-widest text-lg flex items-center gap-2">
                  <i className="fas fa-bell"></i> {modal.title}
                </div>
                <div className="p-6 text-black font-bold whitespace-pre-wrap leading-relaxed text-center">
                  {modal.content}
                </div>
                <div className="p-4 border-t-2 border-[#8b5a2b] border-dashed">
                  <button onClick={closeModal} className="w-full bg-[#8b5a2b] text-[#f4e8d4] font-bold py-3 hover:bg-[#a66c33] active:translate-y-1 shadow-[3px_3px_0_0_rgba(0,0,0,0.5)]">
                    확 인
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className={`w-full max-w-5xl grid grid-cols-1 ${view === 'ending' ? 'md:grid-cols-1' : 'md:grid-cols-3'} gap-4 ${modal.isOpen ? 'pointer-events-none blur-sm' : ''}`}>
            
            {/* 엔딩 화면에서는 왼쪽 상태창을 가립니다 */}
            {view !== 'ending' && (
            <div className="space-y-4 md:col-span-1 flex flex-col">
              <RetroFrame title="STATUS" className="flex-1 p-4">
                <div className="text-center mb-4 pb-2 border-b-2 border-[#8b5a2b] border-dashed">
                  <h1 className="text-2xl font-black tracking-tighter">THE TYRANT MAKER</h1>
                  <p className="text-xs font-bold text-gray-600">Reborn Striker</p>
                </div>
                <div className="flex flex-col items-center mb-4 mt-2">
                  <div className="w-24 h-24 bg-[#e2d5c0] border-[3px] border-[#8b5a2b] flex items-center justify-center shadow-inner mb-3 relative overflow-hidden transition-all duration-300">
                    {getStressIcon()}
                  </div>
                  <h2 className="text-xl font-bold tracking-widest">마강철</h2>
                  <p className="text-sm font-bold text-[#6b4a2b]">{age}세 {month}월</p>
                </div>

                <div className="bg-red-100 border-2 border-red-800 p-2 mb-4 text-center shadow-inner">
                    <span className="text-xs font-bold text-red-800 block mb-1">다음 대회 [ {currentChapter.name} ] 출전 기한</span>
                    <span className="text-xl font-black text-red-600 tracking-widest">D - {deadline} 개월</span>
                </div>

                <div className="space-y-2 text-sm font-bold border-b-2 border-[#8b5a2b] border-dashed pb-4 mb-4">
                  <div className="flex justify-between items-center">
                    <span>자금 (Gold)</span> <span className="text-orange-700">{money.toLocaleString()} G</span>
                  </div>
                  <div className="flex justify-between items-center" title="명성에 비례해 행사 수입이 증가합니다">
                    <span>명성 (Fame)</span> <span className="text-blue-700">{reputation.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span>스트레스</span> <span className={stress >= 80 ? "text-red-600" : ""}>{stress} / 100</span>
                  </div>
                </div>

                <div className="space-y-2 text-sm font-bold">
                  <StatRow label="축구 지능" value={stats.intelligence} />
                  <StatRow label="테크닉" value={stats.technique} />
                  <StatRow label="근력 (Power)" value={stats.strength} />
                  <StatRow label="신체 밸런스" value={stats.balance} />
                  <StatRow label="강철 체력" value={stats.stamina} />
                </div>
                
                <div className="mt-6 p-2 bg-[#8b5a2b] text-[#f4e8d4] text-center font-bold text-sm shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">
                  종합 전투력 : {getPlayerPower().toLocaleString()}
                </div>
              </RetroFrame>

              <RetroFrame title="SYSTEM" className="p-3">
                <div className="flex gap-2">
                    <button onClick={saveGame} className="flex-1 bg-blue-900 text-white font-bold p-2 text-xs border-2 border-blue-950 shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] hover:bg-blue-800 active:translate-y-1">
                        <i className="fas fa-save mr-1"></i> 저장
                    </button>
                    <button onClick={loadGame} className="flex-1 bg-green-900 text-white font-bold p-2 text-xs border-2 border-green-950 shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] hover:bg-green-800 active:translate-y-1">
                        <i className="fas fa-folder-open mr-1"></i> 로드
                    </button>
                    <button onClick={resetGame} className="flex-1 bg-red-900 text-white font-bold p-2 text-xs border-2 border-red-950 shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] hover:bg-red-800 active:translate-y-1">
                        <i className="fas fa-power-off mr-1"></i> 리셋
                    </button>
                </div>
              </RetroFrame>
            </div>
            )}

            <div className={`${view === 'ending' ? 'md:col-span-1' : 'md:col-span-2'} flex flex-col gap-4`}>
              
              {view === 'ending' && ending && (
                <RetroFrame title="THE TYRANT MAKER : ENDING" className="bg-white flex flex-col items-center justify-center p-4 md:p-12 min-h-[600px] w-full max-w-2xl mx-auto">
                    <div className="text-center mb-8 animate-pop">
                        <h2 className="text-3xl md:text-5xl font-black mb-3 text-gray-900">최종 결산</h2>
                        <p className="text-gray-600 font-bold">마강철의 기나긴 회귀 여정이 마침내 막을 내렸습니다.</p>
                    </div>

                    <div className="bg-gray-100 border-[4px] border-black p-6 w-full max-w-md shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] mb-8 animate-pop" style={{animationDelay: '0.2s'}}>
                        <div className="flex justify-between items-center mb-6 pb-4 border-b-2 border-dashed border-gray-400">
                            <span className="font-bold text-lg text-gray-800">최종 랭크</span>
                            <span className={`text-2xl font-black px-4 py-1 border-[3px] border-black ${ending.color}`}>
                                {ending.rank}
                            </span>
                        </div>
                        <div className="text-center mb-4">
                            <h3 className="text-2xl font-black text-[#8b5a2b]">{ending.title}</h3>
                        </div>
                        <p className="text-base font-bold text-gray-800 leading-relaxed text-center break-keep">
                            {ending.desc}
                        </p>
                    </div>

                    <div className="w-full max-w-md grid grid-cols-2 gap-4 text-sm font-bold mb-8 animate-pop" style={{animationDelay: '0.4s'}}>
                        <div className="bg-white border-[3px] border-black p-3 text-center shadow-[2px_2px_0_0_rgba(0,0,0,0.3)]">
                            <div className="text-gray-500 mb-1">최종 자금</div>
                            <div className="text-orange-600 text-lg">{money.toLocaleString()} G</div>
                        </div>
                        <div className="bg-white border-[3px] border-black p-3 text-center shadow-[2px_2px_0_0_rgba(0,0,0,0.3)]">
                            <div className="text-gray-500 mb-1">최종 명성</div>
                            <div className="text-blue-600 text-lg">{reputation.toLocaleString()}</div>
                        </div>
                    </div>

                    <button onClick={resetGame} className="bg-[#8b5a2b] text-[#f4e8d4] border-[4px] border-[#5a3a1b] font-black text-xl py-4 w-full max-w-md hover:bg-[#a66c33] active:translate-y-1 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] animate-pop" style={{animationDelay: '0.6s'}}>
                        새로운 인생 시작하기 (리셋)
                    </button>
                </RetroFrame>
              )}

              {view === 'lobby' && (
                <RetroFrame title="ACTION MENU" className="h-full flex flex-col justify-center p-4 min-h-[500px]">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 h-full">
                    <button onClick={() => setView('schedule')} className="retro-btn" disabled={deadline <= 0}>
                      <i className="fas fa-calendar-alt text-4xl mb-3 text-blue-800 drop-shadow-md"></i>
                      스케줄 편성 (한 달 소모)
                    </button>
                    <button onClick={() => setView('shop')} className="retro-btn">
                      <i className="fas fa-store text-4xl mb-3 text-green-800 drop-shadow-md"></i>
                      상점 (아이템 / 특성)
                    </button>
                    <button onClick={() => startMatch(null)} className="retro-btn-dark md:col-span-2 !text-xl">
                      <i className="fas fa-khanda text-4xl mb-3 text-yellow-400 drop-shadow-md"></i>
                      [전투 진입] 상대: {currentChapter.opponent}
                    </button>
                  </div>
                </RetroFrame>
              )}

              {view === 'schedule' && (
                <RetroFrame title="SCHEDULE PLANNER" className="h-full flex flex-col p-4 min-h-[500px]">
                  <p className="mb-2 text-sm font-bold text-center border-b-2 border-[#8b5a2b] pb-2">이번 달 4주 치 일정을 꽉 채워주십시오.</p>
                  
                  <div className="grid grid-cols-4 gap-2 mb-4">
                    {scheduleQueue.map((actId, idx) => (
                      <div key={idx} onClick={() => removeFromSchedule(idx)} className={`h-20 border-[3px] flex flex-col items-center justify-center text-xs font-bold cursor-pointer transition-colors ${actId ? 'bg-[#d4f4d4] border-green-800' : 'bg-[#e2d5c0] border-[#8b5a2b] border-dashed hover:bg-[#d8c8b0]'}`}>
                        <span className="mb-1 text-gray-600">{idx + 1}주차</span>
                        {actId ? <span className="text-green-900 text-center px-1">{ACTIVITIES[actId].name}</span> : <span className="text-gray-400">비어있음</span>}
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    {Object.values(ACTIVITIES).map(act => {
                      let displayGold = act.gold;
                      if (act.id === 'alba_sponsor') displayGold = 12000 + (reputation * 50);

                      return (
                        <button key={act.id} onClick={() => addToSchedule(act.id)} className={`retro-list-btn ${act.id === 'rest' ? '!bg-green-100 border-green-800' : act.id === 'alba_sponsor' ? '!bg-blue-100 border-blue-800' : ''}`}>
                          <div className="flex items-center">
                            <i className={`${act.icon} w-5 mr-2 text-center`}></i> {act.name} {act.id === 'alba_sponsor' && <span className="text-[10px] ml-1 text-gray-500 font-normal">(명성 비례)</span>}
                            <span className={`ml-auto text-xs font-bold ${displayGold > 0 ? 'text-blue-700' : 'text-red-700'}`}>({displayGold > 0 ? `+${displayGold.toLocaleString()}` : displayGold.toLocaleString()}G)</span>
                          </div>
                          <div className="text-xs font-normal mt-1 text-gray-700 flex gap-2 flex-wrap">
                            {act.tech !== 0 && <span className={act.tech > 0 ? "text-purple-700 font-bold" : "text-red-600"}>테크닉 {act.tech > 0 ? `+${act.tech}` : act.tech}</span>}
                            {act.int !== 0 && <span className={act.int > 0 ? "text-blue-700 font-bold" : "text-red-600"}>지능 {act.int > 0 ? `+${act.int}` : act.int}</span>}
                            {act.str !== 0 && <span className={act.str > 0 ? "text-orange-700 font-bold" : "text-red-600"}>근력 {act.str > 0 ? `+${act.str}` : act.str}</span>}
                            {act.bal !== 0 && <span className={act.bal > 0 ? "text-yellow-700 font-bold" : "text-red-600"}>밸런스 {act.bal > 0 ? `+${act.bal}` : act.bal}</span>}
                            {act.stam !== 0 && <span className={act.stam > 0 ? "text-green-700 font-bold" : "text-red-600"}>체력 {act.stam > 0 ? `+${act.stam}` : act.stam}</span>}
                            {act.strss !== 0 && <span className={act.strss > 0 ? "text-red-600" : "text-green-700 font-bold"}>스트레스 {act.strss > 0 ? `+${act.strss}` : act.strss}</span>}
                          </div>
                        </button>
                      )
                    })}
                  </div>
                  
                  <div className="mt-4 flex gap-2">
                    <button onClick={clearSchedule} className="p-3 flex-1 text-center border-2 border-gray-600 bg-gray-200 font-bold shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1">지우기</button>
                    <button onClick={executeSchedule} disabled={scheduleQueue.includes(null)} className={`p-3 flex-[2] text-center border-2 font-bold shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1 ${scheduleQueue.includes(null) ? 'bg-gray-400 border-gray-500 text-gray-500 cursor-not-allowed' : 'bg-[#8b5a2b] border-[#5a3a1b] text-[#f4e8d4] hover:bg-[#a66c33]'}`}>
                      결재 진행
                    </button>
                  </div>
                  <button onClick={() => setView('lobby')} className="mt-3 text-sm text-center text-[#8b5a2b] font-bold underline hover:text-black">메뉴로 돌아가기</button>
                </RetroFrame>
              )}

              {view === 'shop' && (
                <RetroFrame title="SHOP" className="h-full flex flex-col p-4 min-h-[500px]">
                  <p className="mb-2 text-sm font-bold text-center border-b-2 border-[#8b5a2b] pb-2">아이템 구매 및 특성 장착 (보유 자금: {money.toLocaleString()}G)</p>
                  <div className="space-y-3 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    
                    <h3 className="text-sm font-black bg-[#8b5a2b] text-[#f4e8d4] p-1 text-center shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">소모품 (1회용)</h3>
                    {ITEMS_DB.map(item => (
                      <div key={item.id} className="p-3 border-[3px] bg-[#f4e8d4] border-[#8b5a2b] shadow-[2px_2px_0_0_rgba(0,0,0,0.3)]">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-base"><i className={`fas ${item.type === 'stress' ? 'fa-flask text-blue-600' : 'fa-pills text-orange-600'} mr-2`}></i>{item.name}</span>
                          <button onClick={() => buyItem(item)} className="bg-blue-800 text-white px-3 py-1 text-xs font-bold hover:bg-blue-700 active:translate-y-1 shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">
                            {item.cost.toLocaleString()} G
                          </button>
                        </div>
                        <div className="text-xs text-gray-700 font-bold">{item.desc}</div>
                      </div>
                    ))}

                    <h3 className="text-sm font-black bg-[#8b5a2b] text-[#f4e8d4] p-1 text-center shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] mt-4">전설의 특성 (영구 장착)</h3>
                    {skills.map(skill => (
                      <div key={skill.id} className={`p-3 border-[3px] shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] ${skill.owned ? 'bg-[#d4f4d4] border-green-800 text-green-900' : 'bg-[#f4e8d4] border-[#8b5a2b]'}`}>
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-base"><i className="fas fa-trophy mr-2 text-yellow-600 drop-shadow-md"></i>{skill.name}</span>
                          {skill.owned ? <span className="text-xs font-bold bg-green-800 text-white px-2 py-1">장착 완료</span> : 
                            <button onClick={() => buySkill(skill)} className="bg-[#8b5a2b] text-[#f4e8d4] px-3 py-1 text-xs font-bold hover:bg-[#a66c33] active:translate-y-1 shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">
                              {skill.cost.toLocaleString()} G
                            </button>
                          }
                        </div>
                        <div className="text-xs">{skill.desc}</div>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => setView('lobby')} className="mt-4 p-3 w-full text-center border-2 border-[#8b5a2b] font-bold hover:bg-[#e2d5c0] shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1">돌아가기</button>
                </RetroFrame>
              )}

              {view === 'match' && (
                <RetroFrame title={matchState.active ? `BATTLE (현재 턴: ${matchState.turn} / 5)` : "BATTLE"} className="h-[650px] bg-white p-0 flex flex-col overflow-hidden">
                  <div className="relative h-[45%] bg-blue-300 border-b-[4px] border-black overflow-hidden shrink-0">
                    <div className="absolute bottom-0 w-full h-1/2 bg-green-500 border-t-[4px] border-green-700"></div>

                    <div className={`absolute top-4 left-4 bg-white border-[4px] border-black p-3 w-52 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] rounded-br-2xl z-10 transition-all duration-100 ${hitAnimTarget === 'enemy' ? 'anim-shake' : ''}`}>
                      <div className="flex justify-between font-black text-black text-sm mb-2">
                        <span className="truncate pr-2">{currentChapter.opponent}</span>
                        <span className="text-gray-600">Lv.{Math.floor(currentChapter.power / 50)}</span>
                      </div>
                      <div className="bg-gray-300 border-2 border-black p-0.5 rounded-full w-full flex items-center h-4 mb-1">
                        <span className="text-[10px] text-yellow-500 font-black ml-1 mr-2 drop-shadow-md">HP</span>
                        <div className="h-full w-full bg-gray-400 rounded-full overflow-hidden border border-gray-600">
                          <div className={`h-full ${getHpColor(matchHp.enemy, matchHp.enemyMax)} transition-all duration-300`} style={{width: `${(matchHp.enemy/matchHp.enemyMax)*100}%`}}></div>
                        </div>
                      </div>
                      <div className="text-right text-[10px] font-black text-gray-500">{matchHp.enemy} / {matchHp.enemyMax}</div>
                    </div>

                    <div className={`absolute top-6 right-10 z-0 flex flex-col items-center transition-all duration-100 ${hitAnimTarget === 'enemy' ? 'anim-shake' : ''}`}>
                      <div className="w-20 h-6 bg-black/30 rounded-full absolute -bottom-2"></div>
                      <i className={`fas fa-shield-alt text-7xl drop-shadow-[0_4px_0_rgba(0,0,0,1)] ${matchHp.enemy === 0 ? 'text-gray-500 opacity-50' : 'text-red-600'}`}></i>
                    </div>

                    <div className={`absolute bottom-8 left-10 z-0 flex flex-col items-center transition-all duration-100 ${hitAnimTarget === 'player' ? 'anim-shake' : ''}`}>
                      <div className="w-24 h-8 bg-black/30 rounded-full absolute -bottom-3"></div>
                      <i className={`fas fa-user text-7xl drop-shadow-[0_4px_0_rgba(0,0,0,1)] ${matchHp.player === 0 ? 'text-gray-500 opacity-50' : 'text-blue-600'}`}></i>
                    </div>

                    <div className={`absolute bottom-4 right-4 bg-white border-[4px] border-black p-3 w-56 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] rounded-tl-2xl z-10 transition-all duration-100 ${hitAnimTarget === 'player' ? 'anim-shake' : ''}`}>
                      <div className="flex justify-between font-black text-black text-sm mb-2">
                        <span>마강철</span>
                        <span className="text-gray-600">Lv.{Math.floor(getPlayerPower() / 50)}</span>
                      </div>
                      <div className="bg-gray-300 border-2 border-black p-0.5 rounded-full w-full flex items-center h-4 mb-1">
                        <span className="text-[10px] text-yellow-500 font-black ml-1 mr-2 drop-shadow-md">HP</span>
                        <div className="h-full w-full bg-gray-400 rounded-full overflow-hidden border border-gray-600">
                          <div className={`h-full ${getHpColor(matchHp.player, matchHp.playerMax)} transition-all duration-300`} style={{width: `${(matchHp.player/matchHp.playerMax)*100}%`}}></div>
                        </div>
                      </div>
                      <div className="text-right text-[10px] font-black text-gray-500">{matchHp.player} / {matchHp.playerMax}</div>
                    </div>
                  </div>

                  <div className="relative h-[35%] bg-white border-b-[6px] border-double border-black p-4 font-mono text-black text-base overflow-y-auto custom-scrollbar whitespace-pre-wrap leading-relaxed shrink-0">
                    {logs.map((log, idx) => (
                      <div key={idx} className={
                        log === "END" ? "hidden" : 
                        log.includes("CRITICAL") ? "text-purple-600 font-black text-lg animate-pulse" :
                        log.includes(">>") ? "text-blue-700 font-black" : 
                        log.includes("상성 우위") || log.includes("피해를 입혔") || log.includes("승리") ? "text-green-700 font-black" : 
                        log.includes("상성 열세") || log.includes("피해를 입었") || log.includes("패배") || log.includes("깜깜") ? "text-red-600 font-black" : 
                        "text-black font-bold tracking-wide"
                      }>
                        {log}
                      </div>
                    ))}
                    {!logs.includes("END") && !matchState.active && <span className="inline-block w-3 h-5 bg-black animate-pulse ml-1 align-middle"></span>}
                    <div ref={logsEndRef} />
                  </div>
                  
                  <div className="h-[20%] bg-gray-200 p-3 shrink-0 flex flex-col justify-center relative">
                    {matchState.active ? (
                        <div className="grid grid-cols-3 gap-2 h-full">
                            <button onClick={() => handleMatchAction('attack')} className="bg-red-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-red-700 p-2">
                                <i className="fas fa-fist-raised text-2xl mb-1 block"></i> 강행돌파<br/><span className="text-xs font-normal">(밀집수비 격파)</span>
                            </button>
                            <button onClick={() => handleMatchAction('pass')} className="bg-blue-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-blue-700 p-2">
                                <i className="fas fa-shoe-prints text-2xl mb-1 block"></i> 전술패스<br/><span className="text-xs font-normal">(거친태클 회피)</span>
                            </button>
                            <button onClick={() => handleMatchAction('skill')} className="bg-purple-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-purple-700 p-2 relative">
                                <i className="fas fa-bolt text-2xl mb-1 block"></i> 특성 해방<br/><span className="text-xs font-normal">(스트레스 15 소모)</span>
                            </button>
                        </div>
                    ) : logs.includes("END") ? (
                        <button onClick={() => { 
                            if(ending) {
                                setView('ending');
                            } else {
                                setView('lobby'); 
                            }
                            setLogs([]); 
                        }} className="w-full h-full bg-white border-[4px] border-black text-black font-black text-xl hover:bg-gray-200 active:translate-y-1 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)]">
                          {ending ? '최종 엔딩 확인하기 ▼' : '로비로 돌아가기 ▼'}
                        </button>
                    ) : (
                        <div className="flex items-center justify-center h-full text-gray-500 font-bold">전투 준비 중...</div>
                    )}
                  </div>
                </RetroFrame>
              )}
              
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Game />);
  </script>
</body>
</html>
