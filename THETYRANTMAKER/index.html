<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tyrant Maker: Reborn</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 레트로 공통 버튼 스타일 */
    .retro-btn {
      background-color: #e2d5c0;
      border: 4px solid #8b5a2b;
      border-style: outset;
      padding: 1rem;
      font-weight: bold;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      color: #332211;
      cursor: pointer;
    }
    .retro-btn:active {
      transform: translate(4px, 4px);
      box-shadow: none;
      border-style: inset;
    }
    .retro-btn:hover {
      background-color: #f4e8d4;
    }

    .retro-btn-dark {
      background-color: #8b5a2b;
      color: #f4e8d4;
      border: 4px solid #5a3a1b;
      border-style: outset;
      padding: 1rem;
      font-weight: bold;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      cursor: pointer;
    }
    .retro-btn-dark:active {
      transform: translate(4px, 4px);
      box-shadow: none;
      border-style: inset;
    }
    .retro-btn-dark:hover {
      background-color: #a66c33;
    }

    .retro-list-btn {
      width: 100%;
      text-align: left;
      background-color: #e2d5c0;
      border: 3px solid #8b5a2b;
      padding: 0.75rem;
      font-weight: bold;
      box-shadow: 2px 2px 0 0 rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      transition: transform 0.1s, box-shadow 0.1s;
      color: #332211;
      cursor: pointer;
    }
    .retro-list-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[#1a1a1a]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_STATS = {
      intelligence: 15, technique: 10, strength: 5, balance: 8, stamina: 10,
    };

    const CHAPTERS = [
      { id: 1, name: "시 대회 예선", opponent: "신성초등학교(최도진)", power: 80, reward: 5000 },
      { id: 2, name: "시 대회 결승", opponent: "북산초(도살장 군단)", power: 150, reward: 8000 },
      { id: 3, name: "화랑대기 결승", opponent: "대동초(전국 1위 송민재)", power: 250, reward: 15000 },
      { id: 4, name: "글로벌 유스 컵", opponent: "도르트문트 U-14", power: 380, reward: 25000 },
      { id: 5, name: "유스 컵 4강전", opponent: "바르셀로나 U-14(마테오)", power: 550, reward: 40000 },
      { id: 6, name: "네덜란드 2부 데뷔", opponent: "FC 덴 보스", power: 800, reward: 60000 },
      { id: 7, name: "더 클래식 (원정)", opponent: "로테르담 페예노르트", power: 1100, reward: 90000 },
      { id: 8, name: "U-17 월드컵", opponent: "프랑스 U-17 (줄리앙)", power: 1500, reward: 120000 },
      { id: 9, name: "EPL 개막전", opponent: "브라이튼 (텐백 수비)", power: 2000, reward: 180000 },
      { id: 10, name: "맨체스터 더비", opponent: "맨유(즐라탄)", power: 2600, reward: 250000 },
      { id: 11, name: "챔스 16강전", opponent: "파리 생제르맹(네이마르)", power: 3300, reward: 350000 },
      { id: 12, name: "카라바오 컵 결승", opponent: "아스널", power: 4000, reward: 500000 },
      { id: 13, name: "챔스 8강전", opponent: "레알 마드리드(크카모)", power: 5000, reward: 700000 },
      { id: 14, name: "러시아 월드컵 결승", opponent: "크로아티아(모드리크)", power: 6500, reward: 1000000 },
      { id: 15, name: "챔스 4강전", opponent: "바르셀로나(신계 마시)", power: 8500, reward: 1500000 },
      { id: 16, name: "챔스 결승 (최종장)", opponent: "로트문트(사이보그 홀란도)", power: 11000, reward: 3000000 }
    ];

    const SKILLS_DB = [
      { id: 'phantom', name: "팬텀 턴 (A)", cost: 20000, bonus: 150, desc: "테크닉 기반 완벽한 탈압박", owned: false },
      { id: 'false9', name: "가짜 9번 (S)", cost: 60000, bonus: 400, desc: "전술적 뇌내 연산 극대화", owned: false },
      { id: 'tank', name: "휴먼 탱크 (SS)", cost: 150000, bonus: 1000, desc: "물리력으로 상대를 분쇄", owned: false },
      { id: 'brain', name: "뇌내 시뮬레이션 (SS)", cost: 350000, bonus: 2500, desc: "3초 앞의 미래를 선점", owned: false },
      { id: 'unbreakable', name: "강철의 육체 (EX)", cost: 800000, bonus: 6000, desc: "부상 면역 및 질량 폭발", owned: false },
    ];

    const ACTIVITIES = {
      train_tactics: { id: 'train_tactics', name: "전술 훈련", int: 5, tech: 3, str: 0, bal: 0, stam: -1, strss: 10, gold: -500, rep: 0, icon: 'fas fa-brain' },
      train_tech: { id: 'train_tech', name: "개인기 훈련", int: 0, tech: 6, str: -1, bal: 2, stam: 0, strss: 12, gold: -800, rep: 0, icon: 'fas fa-shoe-prints' },
      train_physical: { id: 'train_physical', name: "웨이트", int: 0, tech: -1, str: 6, bal: 3, stam: 2, strss: 15, gold: -1000, rep: 0, icon: 'fas fa-dumbbell' },
      train_stamina: { id: 'train_stamina', name: "지옥 셔틀런", int: 0, tech: 0, str: 2, bal: 0, stam: 8, strss: 20, gold: 0, rep: 0, icon: 'fas fa-heartbeat' },
      alba_sponsor: { id: 'alba_sponsor', name: "스폰서 행사", int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: 25, gold: 25000, rep: 5, icon: 'fas fa-coins' },
      rest: { id: 'rest', name: "자유 휴식", int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: -60, gold: -1500, rep: 0, icon: 'fas fa-campground' },
    };

    function Game() {
      const [view, setView] = useState('lobby'); 
      const [age, setAge] = useState(11);
      const [month, setMonth] = useState(3);
      const [money, setMoney] = useState(5000);
      const [reputation, setReputation] = useState(10);
      const [stress, setStress] = useState(0);
      const [stats, setStats] = useState(INITIAL_STATS);
      const [skills, setSkills] = useState(SKILLS_DB);
      const [chapterIdx, setChapterIdx] = useState(0);
      const [logs, setLogs] = useState([]);
      const [scheduleQueue, setScheduleQueue] = useState([null, null, null, null]);
      
      // Match State
      const [matchHp, setMatchHp] = useState({ player: 100, enemy: 100 });
      const [matchState, setMatchState] = useState({ active: false, turn: 1, pScore: 0, oScore: 0 });

      const currentChapter = CHAPTERS[chapterIdx] || CHAPTERS[CHAPTERS.length - 1];
      const logsEndRef = useRef(null);

      useEffect(() => {
        if (logsEndRef.current) {
          logsEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs]);

      // --- 세이브 & 로드 (Local Storage) ---
      const saveGame = () => {
        const saveData = { age, month, money, reputation, stress, stats, skills, chapterIdx };
        localStorage.setItem('tyrant_save_v1', JSON.stringify(saveData));
        alert("게임 진행 상황이 성공적으로 저장되었습니다.");
      };

      const loadGame = () => {
        const data = localStorage.getItem('tyrant_save_v1');
        if (data) {
          const parsed = JSON.parse(data);
          setAge(parsed.age);
          setMonth(parsed.month);
          setMoney(parsed.money);
          setReputation(parsed.reputation);
          setStress(parsed.stress);
          setStats(parsed.stats);
          setSkills(parsed.skills);
          setChapterIdx(parsed.chapterIdx);
          alert("저장된 게임을 불러왔습니다.");
        } else {
          alert("저장된 데이터가 없습니다.");
        }
      };

      const resetGame = () => {
        if(window.confirm("정말 처음(11세)부터 다시 시작하시겠습니까?")) {
            localStorage.removeItem('tyrant_save_v1');
            setAge(11); setMonth(3); setMoney(5000); setReputation(10); setStress(0);
            setStats(INITIAL_STATS); setSkills(SKILLS_DB); setChapterIdx(0);
            setView('lobby');
        }
      };

      const getPlayerPower = () => {
        let basePower = Object.values(stats).reduce((a, b) => a + b, 0) * 6;
        let skillPower = skills.filter(s => s.owned).reduce((acc, curr) => acc + curr.bonus, 0);
        return basePower + skillPower;
      };

      const advanceTime = () => {
        if (month === 12) {
          setMonth(1);
          setAge(a => a + 1);
        } else {
          setMonth(m => m + 1);
        }
      };

      // 스케줄 관련 함수
      const addToSchedule = (actId) => {
        const newQueue = [...scheduleQueue];
        const emptyIdx = newQueue.indexOf(null);
        if (emptyIdx !== -1) {
          newQueue[emptyIdx] = actId;
          setScheduleQueue(newQueue);
        } else {
          alert("이번 달 일정이 꽉 찼습니다!");
        }
      };

      const removeFromSchedule = (index) => {
        const newQueue = [...scheduleQueue];
        newQueue[index] = null;
        setScheduleQueue(newQueue);
      };

      const clearSchedule = () => setScheduleQueue([null, null, null, null]);

      const executeSchedule = () => {
        if (scheduleQueue.includes(null)) {
          alert("4주 차 일정을 모두 채워주세요!");
          return;
        }

        let s = { ...stats };
        let currStress = stress;
        let currMoney = money;
        let currRep = reputation;
        
        let summaryLog = `[${age}세 ${month}월 일정 결과]\n\n`;
        let net = { int: 0, tech: 0, str: 0, bal: 0, stam: 0, strss: 0, gold: 0, rep: 0 };

        for (let i = 0; i < 4; i++) {
          const actKey = scheduleQueue[i];
          
          if (currStress >= 100 && actKey !== 'rest') {
            summaryLog += `${i + 1}주차: 스트레스 폭발로 쓰러졌습니다! (병원비 2000G 소모, 체력/근력 하락)\n`;
            const oldStress = currStress; currStress = Math.max(0, currStress - 40); net.strss += (currStress - oldStress);
            const oldStam = s.stamina; s.stamina = Math.max(0, s.stamina - 2); net.stam += (s.stamina - oldStam);
            const oldStr = s.strength; s.strength = Math.max(0, s.strength - 2); net.str += (s.strength - oldStr);
            const oldMoney = currMoney; currMoney = Math.max(0, currMoney - 2000); net.gold += (currMoney - oldMoney);
            continue;
          }

          const act = ACTIVITIES[actKey];
          summaryLog += `${i + 1}주차: ${act.name}\n`;
          
          const oldInt = s.intelligence; s.intelligence = Math.max(0, s.intelligence + act.int); net.int += (s.intelligence - oldInt);
          const oldTech = s.technique; s.technique = Math.max(0, s.technique + act.tech); net.tech += (s.technique - oldTech);
          const oldStr = s.strength; s.strength = Math.max(0, s.strength + act.str); net.str += (s.strength - oldStr);
          const oldBal = s.balance; s.balance = Math.max(0, s.balance + act.bal); net.bal += (s.balance - oldBal);
          const oldStam = s.stamina; s.stamina = Math.max(0, s.stamina + act.stam); net.stam += (s.stamina - oldStam);
          
          const oldStress = currStress; currStress = Math.max(0, Math.min(100, currStress + act.strss)); net.strss += (currStress - oldStress);
          const oldMoney = currMoney; currMoney = Math.max(0, currMoney + act.gold); net.gold += (currMoney - oldMoney);
          currRep += act.rep; net.rep += act.rep;
        }

        setStats(s); setStress(currStress); setMoney(currMoney); setReputation(currRep);
        
        summaryLog += `\n[월말 능력치 정산]\n`;
        if (net.int !== 0) summaryLog += `지능: ${net.int > 0 ? '+'+net.int : net.int}\n`;
        if (net.tech !== 0) summaryLog += `테크닉: ${net.tech > 0 ? '+'+net.tech : net.tech}\n`;
        if (net.str !== 0) summaryLog += `근력: ${net.str > 0 ? '+'+net.str : net.str}\n`;
        if (net.bal !== 0) summaryLog += `밸런스: ${net.bal > 0 ? '+'+net.bal : net.bal}\n`;
        if (net.stam !== 0) summaryLog += `체력: ${net.stam > 0 ? '+'+net.stam : net.stam}\n`;
        if (net.strss !== 0) summaryLog += `스트레스: ${net.strss > 0 ? '+'+net.strss : net.strss}\n`;
        if (net.gold !== 0) summaryLog += `자금: ${net.gold > 0 ? '+'+net.gold : net.gold} G\n`;
        
        alert(summaryLog);
        setScheduleQueue([null, null, null, null]);
        advanceTime();
        setView('lobby');
        // Auto Save
        setTimeout(saveGame, 500); 
      };

      const buySkill = (skill) => {
        if (money >= skill.cost) {
          setMoney(m => m - skill.cost);
          setSkills(skills.map(s => s.id === skill.id ? { ...s, owned: true } : s));
          alert(`[${skill.name}] 특성을 획득했습니다!`);
        } else {
          alert("자금이 부족합니다.");
        }
      };

      // --- 인터랙티브 전투 시스템 (Match Logic) ---
      const startMatch = () => {
        setView('match');
        setMatchHp({ player: 100, enemy: 100 });
        setMatchState({ active: true, turn: 1, pScore: 0, oScore: 0 });
        setLogs([
          `>> 챕터 ${currentChapter.id} : ${currentChapter.name}`,
          `야생의 [ ${currentChapter.opponent} ] 이(가) 승부를 걸어왔다!`,
          "=====================================",
          "전술을 선택하십시오. (상성을 고려하세요)"
        ]);
      };

      const handleMatchAction = (actionType) => {
        if(!matchState.active) return;

        let { turn, pScore, oScore } = matchState;
        let turnLog = `\n[ ${turn * 20}분 경과 - 마강철의 공격! ]\n`;
        
        // 상대방의 AI 행동 (랜덤)
        const oppActions = ['tackle', 'defense']; // tackle=거친 태클, defense=밀집 수비
        const oppAct = oppActions[Math.floor(Math.random() * oppActions.length)];
        
        let pPower = 0;
        let oPower = currentChapter.power;

        // 플레이어 행동별 스탯 반영 및 상성 계산
        if (actionType === 'attack') {
            // 강행돌파: 근력과 밸런스 위주
            pPower = (stats.strength * 10 + stats.balance * 5) * 2;
            turnLog += `>> 당신은 [강행돌파]를 지시했습니다!\n`;
            turnLog += `>> 적은 [${oppAct === 'tackle' ? '거친 태클' : '텐백 밀집 수비'}]로 대응합니다.\n`;
            
            if (oppAct === 'defense') {
                turnLog += `>> 💥 상성 우위! 폭군의 피지컬이 밀집 수비를 뚫어버립니다!\n`;
                pPower = pPower * 2.0;
            } else {
                turnLog += `>> ⚔️ 정면 충돌! 순수 무력 싸움이 벌어집니다!\n`;
            }
        } 
        else if (actionType === 'pass') {
            // 전술패스: 지능과 테크닉 위주
            pPower = (stats.intelligence * 10 + stats.technique * 5) * 2;
            turnLog += `>> 당신은 [전술패스]를 시도합니다!\n`;
            turnLog += `>> 적은 [${oppAct === 'tackle' ? '거친 태클' : '텐백 밀집 수비'}]로 대응합니다.\n`;
            
            if (oppAct === 'tackle') {
                turnLog += `>> ✨ 상성 우위! 상대의 거친 태클을 우아한 원터치로 회피합니다!\n`;
                pPower = pPower * 2.0;
            } else {
                turnLog += `>> ❌ 상성 열세! 촘촘한 수비벽에 패스 길이 막힙니다!\n`;
                oPower = oPower * 1.5;
            }
        }
        else if (actionType === 'skill') {
            const ownedSkills = skills.filter(s => s.owned);
            if (ownedSkills.length > 0) {
                if (stress >= 80) {
                    turnLog += `>> ⚠️ 피로 누적으로 특성 발동에 실패했습니다!\n`;
                    pPower = 0;
                } else {
                    const usedSkill = ownedSkills[Math.floor(Math.random() * ownedSkills.length)];
                    turnLog += `>> 🔥 특성 개방! [ ${usedSkill.name} ] !!\n`;
                    pPower = getPlayerPower() * 2.0; // 특성 사용 시 전투력 폭발
                    setStress(s => Math.min(100, s + 15)); // 특성 사용 페널티
                    turnLog += `>> 엄청난 에너지를 뿜어냅니다! (스트레스 상승)\n`;
                }
            } else {
                turnLog += `>> 장착된 특성이 없습니다! 턴을 허무하게 날립니다!\n`;
                pPower = 0;
            }
        }

        // 약간의 난수 부여
        pPower += Math.floor(Math.random() * (pPower * 0.2));
        oPower += Math.floor(Math.random() * (oPower * 0.2));

        // 결과 판정
        let isPlayerHit = false;
        let isEnemyHit = false;

        if (pPower >= oPower) {
            pScore++;
            turnLog += `>> 골망을 흔들었다! (마강철 득점!)\n`;
            isEnemyHit = true;
        } else {
            oScore++;
            turnLog += `>> 상대의 역습! 마강철은 피해를 입었다!\n`;
            isPlayerHit = true;
        }

        setLogs(prev => [...prev, turnLog]);
        
        // HP Update
        if(isEnemyHit) setMatchHp(prev => ({ ...prev, enemy: Math.max(0, prev.enemy - 25) }));
        if(isPlayerHit) setMatchHp(prev => ({ ...prev, player: Math.max(0, prev.player - 25) }));

        // Check Match End
        if (turn >= 4 || matchHp.enemy - 25 <= 0 || matchHp.player - 25 <= 0) {
            setMatchState({ active: false, turn: turn + 1, pScore, oScore });
            setTimeout(() => finishMatch(pScore, oScore, isEnemyHit, isPlayerHit), 1000);
        } else {
            setMatchState({ active: true, turn: turn + 1, pScore, oScore });
            setLogs(prev => [...prev, "-------------------------------------", "다음 전술을 선택하십시오."]);
        }
      };

      const finishMatch = (pScore, oScore, lastEnemyHit, lastPlayerHit) => {
        let finalLog = `\n=====================================\n경기 종료! [ 마강철 ${pScore} : ${oScore} 적 ]`;
        
        // Final HP sync
        let finalEnemyHp = matchHp.enemy - (lastEnemyHit ? 25 : 0);
        let finalPlayerHp = matchHp.player - (lastPlayerHit ? 25 : 0);

        if (pScore > oScore || finalEnemyHp <= 0) {
          finalLog += `\n승부에서 이겼다! \n전리품으로 ${currentChapter.reward}G 를 획득했다!`;
          setMatchHp(prev => ({ ...prev, enemy: 0 }));
          setMoney(m => m + currentChapter.reward);
          setReputation(r => r + 100);
          setStress(s => Math.max(0, s - 30)); 
          
          if (chapterIdx < CHAPTERS.length - 1) {
            finalLog += `\n\n[ 시스템 알림 ] 다음 스테이지가 개방되었습니다.`;
            setChapterIdx(c => c + 1);
          } else {
            finalLog += `\n\n★ 축하합니다! 모든 퀘스트를 완료하고 세계 축구의 신(神)으로 등극했습니다! (엔딩) ★`;
          }
        } else {
          finalLog += `\n마강철은 압도적인 질량 차이에 눈앞이 깜깜해졌다...\n능력치를 더 올리거나 새 특성을 장착해야 합니다.`;
          setMatchHp(prev => ({ ...prev, player: 0 }));
          setStress(s => Math.min(100, s + 40));
        }
        
        setLogs(prev => [...prev, finalLog, "END"]);
      };

      const getHpColor = (hp) => {
        if (hp > 50) return 'bg-green-500';
        if (hp > 20) return 'bg-yellow-400';
        return 'bg-red-500';
      };

      const RetroFrame = ({ title, children, className = "" }) => (
        <div className={`bg-[#f4e8d4] border-[6px] border-[#8b5a2b] border-double shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] relative ${className}`}>
          {title && (
            <div className="absolute -top-4 left-4 bg-[#8b5a2b] text-[#f4e8d4] px-3 py-0.5 text-sm font-bold tracking-widest shadow-[2px_2px_0_0_rgba(0,0,0,0.5)] z-20">
              {title}
            </div>
          )}
          <div className={`flex flex-col h-full w-full ${title ? "mt-2" : ""}`}>
            {children}
          </div>
        </div>
      );

      const getStressIcon = () => {
        if (stress >= 80) return <i className="fas fa-skull text-purple-700 animate-pulse text-5xl"></i>;
        if (stress >= 50) return <i className="fas fa-frown text-orange-600 text-5xl"></i>;
        return <i className="fas fa-smile text-green-600 text-5xl"></i>;
      };

      return (
        <div className="min-h-screen text-[#332211] font-serif p-2 md:p-8 flex justify-center items-center selection:bg-[#8b5a2b] selection:text-white">
          <div className="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-4">
            
            {/* 왼쪽 상태창 */}
            <div className="space-y-4 md:col-span-1 flex flex-col">
              <RetroFrame title="STATUS" className="flex-1 p-4">
                <div className="text-center mb-4 pb-2 border-b-2 border-[#8b5a2b] border-dashed">
                  <h1 className="text-2xl font-black tracking-tighter">THE TYRANT MAKER</h1>
                  <p className="text-xs font-bold text-gray-600">Reborn Striker</p>
                </div>
                <div className="flex flex-col items-center mb-6 mt-2">
                  <div className="w-24 h-24 bg-[#e2d5c0] border-[3px] border-[#8b5a2b] flex items-center justify-center shadow-inner mb-3 relative overflow-hidden">
                    {getStressIcon()}
                  </div>
                  <h2 className="text-xl font-bold tracking-widest">마강철</h2>
                  <p className="text-sm font-bold text-[#6b4a2b]">{age}세 {month}월</p>
                  <p className="text-xs font-bold text-gray-500 mt-1">스테이지 {chapterIdx + 1} / 16</p>
                </div>

                <div className="space-y-2 text-sm font-bold border-b-2 border-[#8b5a2b] border-dashed pb-4 mb-4">
                  <div className="flex justify-between items-center">
                    <span>자금 (Gold)</span>
                    <span className="text-orange-700">{money.toLocaleString()} G</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span>명성 (Fame)</span>
                    <span className="text-blue-700">{reputation}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span>스트레스</span>
                    <span className={stress >= 80 ? "text-red-600" : ""}>{stress} / 100</span>
                  </div>
                </div>

                <div className="space-y-3 text-sm font-bold">
                  <div className="flex justify-between"><span>축구 지능</span> <span>{stats.intelligence}</span></div>
                  <div className="flex justify-between"><span>테크닉</span> <span className="text-purple-700">{stats.technique}</span></div>
                  <div className="flex justify-between"><span>근력 (Power)</span> <span>{stats.strength}</span></div>
                  <div className="flex justify-between"><span>밸런스</span> <span>{stats.balance}</span></div>
                  <div className="flex justify-between"><span>강철 폐장</span> <span>{stats.stamina}</span></div>
                </div>
                
                <div className="mt-6 p-2 bg-[#8b5a2b] text-[#f4e8d4] text-center font-bold text-sm shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">
                  기본 전투력 : {getPlayerPower()}
                </div>
              </RetroFrame>

              {/* 시스템 컨트롤 (세이브/로드) */}
              <RetroFrame title="SYSTEM" className="p-3">
                <div className="flex gap-2">
                    <button onClick={saveGame} className="flex-1 bg-blue-900 text-white font-bold p-2 text-xs border-2 border-blue-950 shadow-md hover:bg-blue-800">
                        <i className="fas fa-save mr-1"></i> 저장
                    </button>
                    <button onClick={loadGame} className="flex-1 bg-green-900 text-white font-bold p-2 text-xs border-2 border-green-950 shadow-md hover:bg-green-800">
                        <i className="fas fa-folder-open mr-1"></i> 불러오기
                    </button>
                    <button onClick={resetGame} className="flex-1 bg-red-900 text-white font-bold p-2 text-xs border-2 border-red-950 shadow-md hover:bg-red-800">
                        <i className="fas fa-power-off mr-1"></i> 리셋
                    </button>
                </div>
              </RetroFrame>
            </div>

            {/* 오른쪽 메인 액션 창 */}
            <div className="md:col-span-2 flex flex-col gap-4">
              
              {view === 'lobby' && (
                <RetroFrame title="ACTION MENU" className="h-full flex flex-col justify-center p-4 min-h-[500px]">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 h-full">
                    <button onClick={() => setView('schedule')} className="retro-btn">
                      <i className="fas fa-calendar-alt text-4xl mb-3 text-blue-800"></i>
                      스케줄 편성 (한 달)
                    </button>
                    <button onClick={() => setView('shop')} className="retro-btn">
                      <i className="fas fa-tshirt text-4xl mb-3 text-green-800"></i>
                      특성 장착 (상점)
                    </button>
                    <button onClick={startMatch} className="retro-btn-dark md:col-span-2 !text-xl">
                      <i className="fas fa-khanda text-4xl mb-3 text-yellow-400"></i>
                      [전투 진입] 다음 상대: {currentChapter.opponent}
                    </button>
                  </div>
                </RetroFrame>
              )}

              {view === 'schedule' && (
                <RetroFrame title="SCHEDULE PLANNER" className="h-full flex flex-col p-4 min-h-[500px]">
                  <p className="mb-2 text-sm font-bold text-center border-b-2 border-[#8b5a2b] pb-2">이번 달 4주 치 일정을 꽉 채워주십시오.</p>
                  
                  <div className="grid grid-cols-4 gap-2 mb-4">
                    {scheduleQueue.map((actId, idx) => (
                      <div 
                        key={idx} 
                        onClick={() => removeFromSchedule(idx)}
                        className={`h-20 border-[3px] flex flex-col items-center justify-center text-xs font-bold cursor-pointer transition-colors ${actId ? 'bg-[#d4f4d4] border-green-800' : 'bg-[#e2d5c0] border-[#8b5a2b] border-dashed hover:bg-[#d8c8b0]'}`}
                        title="클릭하여 취소"
                      >
                        <span className="mb-1 text-gray-600">{idx + 1}주차</span>
                        {actId ? (
                          <span className="text-green-900 text-center px-1">{ACTIVITIES[actId].name}</span>
                        ) : (
                          <span className="text-gray-400">비어있음</span>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    {Object.values(ACTIVITIES).map(act => (
                      <button key={act.id} onClick={() => addToSchedule(act.id)} className={`retro-list-btn ${act.id === 'rest' ? '!bg-green-100 border-green-800' : act.id === 'alba_sponsor' ? '!bg-blue-100 border-blue-800' : ''}`}>
                        <div className="flex items-center">
                          <i className={`${act.icon} w-5 mr-2 text-center`}></i>
                          {act.name} 
                          <span className={`ml-auto text-xs font-bold ${act.gold > 0 ? 'text-blue-700' : 'text-red-700'}`}>({act.gold > 0 ? `+${act.gold}` : act.gold}G)</span>
                        </div>
                        <div className="text-xs font-normal mt-1 text-gray-700 flex gap-2 flex-wrap">
                          {act.tech !== 0 && <span className={act.tech > 0 ? "text-purple-700 font-bold" : "text-red-600"}>테크닉 {act.tech > 0 ? `+${act.tech}` : act.tech}</span>}
                          {act.int !== 0 && <span className={act.int > 0 ? "text-blue-700 font-bold" : "text-red-600"}>지능 {act.int > 0 ? `+${act.int}` : act.int}</span>}
                          {act.str !== 0 && <span className={act.str > 0 ? "text-orange-700 font-bold" : "text-red-600"}>근력 {act.str > 0 ? `+${act.str}` : act.str}</span>}
                          {act.bal !== 0 && <span className={act.bal > 0 ? "text-yellow-700 font-bold" : "text-red-600"}>밸런스 {act.bal > 0 ? `+${act.bal}` : act.bal}</span>}
                          {act.stam !== 0 && <span className={act.stam > 0 ? "text-green-700 font-bold" : "text-red-600"}>체력 {act.stam > 0 ? `+${act.stam}` : act.stam}</span>}
                          {act.strss !== 0 && <span className={act.strss > 0 ? "text-red-600" : "text-green-700 font-bold"}>스트레스 {act.strss > 0 ? `+${act.strss}` : act.strss}</span>}
                        </div>
                      </button>
                    ))}
                  </div>
                  
                  <div className="mt-4 flex gap-2">
                    <button onClick={clearSchedule} className="p-3 flex-1 text-center border-2 border-gray-600 bg-gray-200 font-bold shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1">
                      모두 지우기
                    </button>
                    <button 
                      onClick={executeSchedule} 
                      disabled={scheduleQueue.includes(null)}
                      className={`p-3 flex-[2] text-center border-2 font-bold shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1 ${scheduleQueue.includes(null) ? 'bg-gray-400 border-gray-500 text-gray-500 cursor-not-allowed' : 'bg-[#8b5a2b] border-[#5a3a1b] text-[#f4e8d4] hover:bg-[#a66c33]'}`}
                    >
                      일정 실행하기
                    </button>
                  </div>
                  <button onClick={() => setView('lobby')} className="mt-3 text-sm text-center text-[#8b5a2b] font-bold underline hover:text-black">
                    메뉴로 돌아가기
                  </button>
                </RetroFrame>
              )}

              {view === 'shop' && (
                <RetroFrame title="SHOP" className="h-full flex flex-col p-4 min-h-[500px]">
                  <p className="mb-4 text-sm font-bold text-center border-b-2 border-[#8b5a2b] pb-2">특성을 장착하시겠습니까? (자금: {money.toLocaleString()}G)</p>
                  <div className="space-y-3 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    {skills.map(skill => (
                      <div key={skill.id} className={`p-4 border-[3px] shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] ${skill.owned ? 'bg-[#d4f4d4] border-green-800 text-green-900' : 'bg-[#f4e8d4] border-[#8b5a2b]'}`}>
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-lg flex items-center">
                            <i className="fas fa-trophy mr-2 text-yellow-600"></i> {skill.name}
                          </span>
                          {skill.owned ? (
                            <span className="text-sm font-bold">장착 완료</span>
                          ) : (
                            <button onClick={() => buySkill(skill)} className="bg-[#8b5a2b] text-[#f4e8d4] px-4 py-2 text-sm font-bold hover:bg-[#a66c33] active:translate-y-1">
                              {skill.cost.toLocaleString()} G
                            </button>
                          )}
                        </div>
                        <div className="text-sm mt-2">{skill.desc}</div>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => setView('lobby')} className="mt-4 p-3 w-full text-center border-2 border-[#8b5a2b] font-bold hover:bg-[#e2d5c0] shadow-[2px_2px_0_0_rgba(0,0,0,0.3)] active:translate-y-1">
                    돌아가기
                  </button>
                </RetroFrame>
              )}

              {view === 'match' && (
                <RetroFrame title="BATTLE" className="h-full bg-white p-0 min-h-[600px] flex flex-col">
                  
                  {/* 상단 비주얼 영역 */}
                  <div className="relative flex-[2] bg-blue-300 border-b-[4px] border-black overflow-hidden min-h-[200px]">
                    <div className="absolute bottom-0 w-full h-1/2 bg-green-500 border-t-[4px] border-green-700"></div>

                    {/* 상대방 상태 */}
                    <div className="absolute top-4 left-4 bg-white border-[4px] border-black p-3 w-52 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] rounded-br-2xl z-10">
                      <div className="flex justify-between font-black text-black text-sm mb-2">
                        <span className="truncate pr-2">{currentChapter.opponent}</span>
                        <span className="text-gray-600">Lv.{Math.floor(currentChapter.power / 50)}</span>
                      </div>
                      <div className="bg-gray-300 border-2 border-black p-0.5 rounded-full w-full flex items-center h-4">
                        <span className="text-[10px] text-yellow-500 font-black ml-1 mr-2 drop-shadow-md">HP</span>
                        <div className="h-full w-full bg-gray-400 rounded-full overflow-hidden border border-gray-600">
                          <div className={`h-full ${getHpColor(matchHp.enemy)} transition-all duration-300`} style={{width: `${matchHp.enemy}%`}}></div>
                        </div>
                      </div>
                    </div>

                    <div className="absolute top-6 right-10 z-0 flex flex-col items-center">
                      <div className="w-20 h-6 bg-black/30 rounded-full absolute -bottom-2"></div>
                      <i className={`fas fa-shield-alt text-7xl drop-shadow-[0_4px_0_rgba(0,0,0,1)] ${matchHp.enemy === 0 ? 'text-gray-500 opacity-50' : 'text-red-600'}`}></i>
                    </div>

                    {/* 플레이어 상태 */}
                    <div className="absolute bottom-8 left-10 z-0 flex flex-col items-center">
                      <div className="w-24 h-8 bg-black/30 rounded-full absolute -bottom-3"></div>
                      <i className={`fas fa-user text-7xl drop-shadow-[0_4px_0_rgba(0,0,0,1)] ${matchHp.player === 0 ? 'text-gray-500 opacity-50' : 'text-blue-600'}`}></i>
                    </div>

                    <div className="absolute bottom-4 right-4 bg-white border-[4px] border-black p-3 w-56 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] rounded-tl-2xl z-10">
                      <div className="flex justify-between font-black text-black text-sm mb-2">
                        <span>마강철</span>
                        <span className="text-gray-600">Lv.{Math.floor(getPlayerPower() / 50)}</span>
                      </div>
                      <div className="bg-gray-300 border-2 border-black p-0.5 rounded-full w-full flex items-center h-4 mb-1">
                        <span className="text-[10px] text-yellow-500 font-black ml-1 mr-2 drop-shadow-md">HP</span>
                        <div className="h-full w-full bg-gray-400 rounded-full overflow-hidden border border-gray-600">
                          <div className={`h-full ${getHpColor(matchHp.player)} transition-all duration-300`} style={{width: `${matchHp.player}%`}}></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* 중간 로그 영역 */}
                  <div className="relative flex-[2] bg-white border-b-[8px] border-double border-black p-4 font-mono text-black text-base overflow-y-auto custom-scrollbar whitespace-pre-wrap leading-relaxed min-h-[150px]">
                    {logs.map((log, idx) => (
                      <div key={idx} className={
                        log === "END" ? "hidden" : 
                        log.includes(">>") ? "text-blue-700 font-black" : 
                        log.includes("상성 우위") || log.includes("득점") || log.includes("승리") ? "text-green-700 font-black" : 
                        log.includes("상성 열세") || log.includes("역습") || log.includes("패배") ? "text-red-600 font-black" : 
                        "text-black font-bold tracking-wide"
                      }>
                        {log}
                      </div>
                    ))}
                    {!logs.includes("END") && !matchState.active && (
                      <span className="inline-block w-3 h-5 bg-black animate-pulse ml-1 align-middle"></span>
                    )}
                    <div ref={logsEndRef} />
                  </div>
                  
                  {/* 하단 턴제 커맨드 메뉴 */}
                  <div className="flex-[1] bg-gray-200 p-4">
                    {matchState.active ? (
                        <div className="grid grid-cols-3 gap-3 h-full">
                            <button onClick={() => handleMatchAction('attack')} className="bg-red-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-red-700 p-2">
                                <i className="fas fa-fist-raised text-2xl mb-1 block"></i>
                                강행돌파<br/><span className="text-xs font-normal">(밀집수비 격파)</span>
                            </button>
                            <button onClick={() => handleMatchAction('pass')} className="bg-blue-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-blue-700 p-2">
                                <i className="fas fa-shoe-prints text-2xl mb-1 block"></i>
                                전술패스<br/><span className="text-xs font-normal">(거친태클 회피)</span>
                            </button>
                            <button onClick={() => handleMatchAction('skill')} className="bg-purple-800 text-white font-black border-[4px] border-black shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] active:translate-y-1 hover:bg-purple-700 p-2 relative">
                                <i className="fas fa-bolt text-2xl mb-1 block"></i>
                                특성 해방<br/><span className="text-xs font-normal">(스트레스 15 소모)</span>
                            </button>
                        </div>
                    ) : logs.includes("END") ? (
                        <button onClick={() => { setView('lobby'); setLogs([]); }} className="w-full h-full bg-white border-[4px] border-black text-black font-black text-xl hover:bg-gray-200 active:translate-y-1 shadow-[4px_4px_0_0_rgba(0,0,0,0.5)]">
                          로비로 돌아가기 ▼
                        </button>
                    ) : (
                        <div className="flex items-center justify-center h-full text-gray-500 font-bold">
                           전투 준비 중...
                        </div>
                    )}
                  </div>
                </RetroFrame>
              )}
              
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Game />);
  </script>
</body>
</html>
