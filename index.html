<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinos 게임 콜렉션</title>
    <style>
        /* (이전 스타일은 유지하거나 아래와 같이 업데이트) */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 1000px; /* 컨테이너 너비를 약간 넓혔습니다. */
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* 📌 게임 목록 스타일 수정: Flexbox를 사용하여 가로로 배치 */
        .game-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap; /* 창 크기에 따라 줄 바꿈 */
            justify-content: center; /* 가운데 정렬 */
            gap: 20px; /* 항목 사이의 간격 */
        }

        .game-list li {
            width: 280px; /* 각 게임 항목의 너비 */
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden; /* 이미지 모서리 둥글게 처리 */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-list li:hover {
            transform: translateY(-5px); /* 호버 시 약간 위로 이동 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .game-list a {
            text-decoration: none;
            color: #333;
            display: block; /* 전체 항목을 링크로 만듦 */
            padding: 0;
        }

        .game-thumbnail {
            width: 100%;
            height: 150px; /* 이미지 높이 고정 */
            object-fit: cover; /* 이미지가 잘리더라도 영역을 꽉 채움 */
            display: block;
        }

        .game-title {
            padding: 15px 10px;
            background-color: #f9f9f9;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕹️ Jinos 게임 콜렉션 🕹️</h1>
        <p>아래 목록에서 원하는 게임을 선택하여 플레이해 보세요!</p>
        
        <ul id="game-links" class="game-list">
            </ul>
    </div>

    <script>
        // =======================================================
        // 🚨 핵심 수정 부분: 이 배열만 관리하면 됩니다!
        // =======================================================
        const games = [
            // { folder: '폴더 이름', title: '화면에 표시할 게임 제목', file: '시작 파일 이름', image: '썸네일 파일명' }               
            { folder: 'JinosLotto', title: '로또번호 추출기', image: 'thumbnail.png' },
            { folder: 'TaiSai', title: '다이사이', image: 'thumbnail.png' },            
            { folder: 'MyMarble', title: '마이 블루마블게임', image: 'thumbnail.png' },
            { folder: 'PlanetaryDevourer', title: '공허 채집기: 행성 포식자', image: 'thumbnail.png' },            
            { folder: 'DistanceGame', title: '멀리날리기 게임', image: 'thumbnail.png' },
            { folder: 'InfiniteClimber', title: '무한의 등반가', image: 'thumbnail.png' },
            { folder: 'MoneyTycoon', title: '머니타이쿤', image: 'thumbnail.png' },           
            { folder: 'WorldsHardestGame', title: '세상에서 가장 어려운 게임', image: 'thumbnail.png' },           
            { folder: 'MiniCityTraffic', title: '도시 트래픽 관리게임', image: 'thumbnail.png' },            
            { folder: 'AIJanggiBaduk', title: '장기 or 바둑', image: 'thumbnail.png' }, 
            { folder: 'SimpleSUDOKU', title: '심플 스도쿠', image: 'thumbnail.png' },
            { folder: 'SlotMachine', title: '슬롯머신게임', image: 'thumbnail.png' },            
            { folder: 'Hopscotch', title: '땅따먹기', image: 'thumbnail.png' },     
            { folder: 'LunarLanderSimulator', title: '달착륙 시뮬레이터', image: 'thumbnail.png' },
            { folder: 'RetroRacing', title: '고전레이싱', image: 'thumbnail.png' },
            { folder: 'MiniRPG', title: '미니알피지', image: 'thumbnail.png' },            
            { folder: 'Minesweeper', title: '지뢰찾기', image: 'thumbnail.png' },             
            { folder: 'Whac-A-Mole', title: '두더지 잡기', image: 'thumbnail.png' },
            { folder: 'NeonStack', title: '벽돌쌓기', image: 'thumbnail.png' },         
            { folder: 'LuckySoloDefense', title: '나 혼자만 운빨 솔로 디펜스', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'NeonMelodyMaker', title: '비트게임', image: 'thumbnail.png' },
            { folder: 'LogicPuzzle', title: '코딩게임', image: 'thumbnail.png' }, 
            { folder: 'MyTower', title: '디펜스게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨            
            { folder: 'AutonomousRacing', title: '자율운행자동차게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'AutonomousRacingV2', title: '자율운행자동차게임v2', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'PlanetSurvivor', title: '행성디펜스게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'BrickBreaker', title: '블럭깨기 게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'CheonGiNuSeol', title: '천기누설 사주/궁합', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'BungeoppangTycoon', title: '붕어빵 타이쿤', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'AIDroneEvolution', title: 'AI(신경망)드론 진화 구경(?)게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'AICarEvolution', title: 'AI(신경망)자동차 진화 구경(?)게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨
            { folder: 'AIMultiCopter', title: 'AI(신경망) 멀티콥터 진화 구경(?)게임', image: 'thumbnail.png' }, // file을 생략하면 index.html로 간주됨


            
        ];
        
        // 썸네일 이미지의 기본 파일명
        const DEFAULT_IMAGE_NAME = 'thumbnail.png';

        const gameListElement = document.getElementById('game-links');

        games.forEach(game => {
            const folderName = game.folder;
            const gameTitle = game.title;
            const fileName = game.file || 'index.html'; 
            // 썸네일 파일명은 game.image를 사용하거나, 정의되지 않았다면 DEFAULT_IMAGE_NAME을 사용합니다.
            const imageName = game.image || DEFAULT_IMAGE_NAME; 

            // 하이퍼링크 주소 생성: 예) ./game-a/index.html
            const linkPath = `./${folderName}/${fileName}`;
            // 이미지 주소 생성: 예) ./game-a/thumbnail.png
            const imagePath = `./${folderName}/${imageName}`;

            // 1. <li> 요소 생성
            const listItem = document.createElement('li');

            // 2. <a> 요소 생성 (전체를 감싸는 링크)
            const link = document.createElement('a');
            link.href = linkPath;
            link.title = `${gameTitle} 게임 시작`; // 마우스 오버 시 툴팁 추가

            // 3. <img> 요소 생성
            const image = document.createElement('img');
            image.src = imagePath; // 이미지 주소 설정
            image.alt = `${gameTitle} 썸네일 이미지`; // 접근성을 위한 alt 텍스트
            image.classList.add('game-thumbnail');

            // 4. 제목 표시 <div> 생성
            const titleDiv = document.createElement('div');
            titleDiv.textContent = gameTitle;
            titleDiv.classList.add('game-title');
            
            // 5. <a> 안에 이미지와 제목 삽입
            link.appendChild(image);
            link.appendChild(titleDiv);

            // 6. <li> 안에 <a> 삽입
            listItem.appendChild(link);

            // 7. 최종적으로 <ul> 안에 <li> 삽입
            gameListElement.appendChild(listItem);
        });
    </script>
</body>
</html>
