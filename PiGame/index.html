<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi Memory Quest</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for audio effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-bg: #0f172a; /* Slate 900 */
            --card-bg-front: #1e293b; /* Slate 800 */
            --card-bg-back: #3b82f6; /* Blue 500 */
            --card-text-front: #94a3b8; /* Slate 400 */
            --card-text-back: #ffffff;
            --accent-color: #06b6d4; /* Cyan 500 */
            --error-color: #ef4444; /* Red 500 */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--primary-bg);
            color: white;
            overflow: hidden; /* 모바일에서 당겨서 새로고침 방지 */
            touch-action: none;
        }

        h1, .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* 3D Card Container */
        .card-container {
            perspective: 1000px;
            width: clamp(45px, 12vw, 70px);
            height: clamp(60px, 16vw, 95px);
            margin: 0 clamp(3px, 1vw, 6px);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        /* The Card */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* Flipped state */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Front and Back styling */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-front {
            background: linear-gradient(145deg, var(--card-bg-front), #151e2b);
            color: var(--card-text-front);
            /* ? 마크를 보여줄 때 사용 */
        }

        .card-back {
            background: linear-gradient(145deg, var(--card-bg-back), #2563eb);
            color: var(--card-text-back);
            transform: rotateY(180deg);
            /* 실제 숫자를 보여줄 때 사용 */
        }

        /* Error state for card */
        .card.error .card-back {
            background: linear-gradient(145deg, var(--error-color), #b91c1c);
        }

        /* The Conveyor Belt (Scrollable area) */
        .belt-wrapper {
            width: 100%;
            overflow-x: hidden;
            padding: 20px 0;
            position: relative;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .belt {
            display: flex;
            align-items: center;
            transition: transform 0.3s ease-out;
            /* 초기 위치는 JS에서 화면 크기에 맞춰 동적으로 설정합니다 */
        }

        /* Keypad Styling */
        .keypad-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.1s;
            user-select: none;
            backdrop-filter: blur(4px);
            height: clamp(50px, 10vh, 85px); /* 반응형 높이 적용 (aspect-square 대체) */
        }

        .keypad-btn:active, .keypad-btn.active-key {
            transform: scale(0.95);
            background: var(--card-bg-back);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Modals */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        /* Hearts */
        .heart {
            color: var(--error-color);
            transition: transform 0.3s;
        }
        .heart.lost {
            color: #475569; /* Slate 600 */
            transform: scale(0.8);
        }
        
        /* Custom Scrollbar for Ranking */
        .ranking-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .ranking-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .ranking-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        /* Glow Effects */
        .glow-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen relative">

    <!-- Header / Status Bar -->
    <header class="w-full flex justify-between items-center p-4 bg-slate-800/50 backdrop-blur border-b border-slate-700/50 z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-infinity text-cyan-400 text-xl"></i>
            <h1 class="text-xl font-bold tracking-wider text-cyan-400">PI QUEST</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Score -->
            <div class="text-center">
                <div class="text-xs text-slate-400 uppercase tracking-wide">Score</div>
                <div id="scoreDisplay" class="orbitron text-2xl font-bold text-white">0</div>
            </div>
            
            <!-- Lives (Hearts) -->
            <div id="livesContainer" class="flex gap-1 text-xl">
                <i class="fa-solid fa-heart heart"></i>
                <i class="fa-solid fa-heart heart"></i>
                <i class="fa-solid fa-heart heart"></i>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full max-w-lg mx-auto">
        
        <!-- Target Number Hint (Next Number to guess) -->
        <div id="targetHint" class="mb-8 text-center opacity-0 transition-opacity duration-300">
            <div class="text-sm text-slate-400 mb-1">Next Digit</div>
            <div class="w-16 h-16 rounded-full border-2 border-dashed border-cyan-500/50 flex items-center justify-center text-3xl font-bold orbitron text-cyan-400 animate-pulse bg-cyan-900/20">
                ?
            </div>
        </div>

        <!-- Cards Belt -->
        <div class="belt-wrapper w-full">
            <div id="cardsBelt" class="belt">
                <!-- Cards will be injected here by JS -->
                <!-- The first card is typically "3." -->
            </div>
        </div>

    </main>

    <!-- Keypad Area (Bottom) -->
    <footer class="w-full p-4 bg-slate-900/80 backdrop-blur border-t border-slate-800/50 pb-8 z-10">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-3" id="keypad">
            <!-- Numbers 1-9 -->
            <button class="keypad-btn" data-val="1">1</button>
            <button class="keypad-btn" data-val="2">2</button>
            <button class="keypad-btn" data-val="3">3</button>
            <button class="keypad-btn" data-val="4">4</button>
            <button class="keypad-btn" data-val="5">5</button>
            <button class="keypad-btn" data-val="6">6</button>
            <button class="keypad-btn" data-val="7">7</button>
            <button class="keypad-btn" data-val="8">8</button>
            <button class="keypad-btn" data-val="9">9</button>
            
            <!-- Utility buttons & 0 -->
            <button id="btnLeaderboard" class="keypad-btn text-cyan-400 flex flex-col items-center justify-center gap-1" style="font-size: 1rem;">
                <i class="fa-solid fa-trophy text-xl"></i>
                <span class="text-xs">Rank</span>
            </button>
            <button class="keypad-btn" data-val="0">0</button>
            <button id="btnOptions" class="keypad-btn text-slate-400 flex flex-col items-center justify-center gap-1" style="font-size: 1rem;">
                <i class="fa-solid fa-gear text-xl"></i>
                <span class="text-xs">Menu</span>
            </button>
        </div>
    </footer>

    <!-- Start/Menu Modal -->
    <div id="menuModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4 text-center transform transition-all duration-300 scale-100">
            <i class="fa-solid fa-infinity text-6xl text-cyan-500 mb-4 glow-text"></i>
            <h2 class="orbitron text-3xl font-bold mb-2">PI QUEST</h2>
            <p class="text-slate-400 text-sm mb-8">Memorize the digits of Pi.</p>
            
            <div class="flex flex-col gap-3">
                <button id="btnModeClassic" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-play"></i> Classic Mode (3 Lives)
                </button>
                <button id="btnModeSuddenDeath" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-skull"></i> Sudden Death (1 Life)
                </button>
                <button id="btnModePractice" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition flex justify-center items-center gap-2 border border-slate-600">
                    <i class="fa-solid fa-book-open"></i> Practice Mode
                </button>
            </div>
            
            <div class="mt-6 flex justify-center gap-4 text-slate-400">
                <button id="btnMenuLeaderboard" class="hover:text-white transition flex flex-col items-center">
                    <i class="fa-solid fa-trophy mb-1"></i>
                    <span class="text-xs">Rankings</span>
                </button>
                <button id="btnToggleSound" class="hover:text-white transition flex flex-col items-center">
                    <i class="fa-solid fa-volume-high mb-1" id="soundIcon"></i>
                    <span class="text-xs">Sound</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4 text-center">
            <h2 class="orbitron text-3xl font-bold text-red-500 mb-2">GAME OVER</h2>
            <p id="gameOverMsg" class="text-slate-400 mb-6">You missed the digit!</p>
            
            <div class="bg-slate-900 rounded-lg p-4 mb-6">
                <div class="text-sm text-slate-400 uppercase tracking-wide mb-1">Final Score</div>
                <div id="finalScore" class="orbitron text-5xl font-bold text-cyan-400 glow-text mb-2">0</div>
                
                <div id="newBestBadge" class="hidden inline-block bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 text-xs px-2 py-1 rounded-full font-bold uppercase tracking-wider mb-2 animate-bounce">
                    New Best!
                </div>
                
                <div class="text-xs text-slate-500">Correct sequence:</div>
                <div id="correctSequence" class="font-mono text-sm break-all mt-1 text-slate-300 max-h-20 overflow-y-auto ranking-scroll">
                    3.14...
                </div>
            </div>
            
            <div class="flex gap-3">
                <button id="btnRestart" class="flex-1 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Try Again
                </button>
                <button id="btnGoMenu" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition border border-slate-600">
                    Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="orbitron text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-yellow-400"></i> Global Top 50
                </h2>
                <button id="btnCloseLeaderboard" class="text-slate-400 hover:text-white transition w-8 h-8 flex items-center justify-center rounded-full bg-slate-700/50">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Loading Indicator -->
            <div id="rankingLoading" class="flex-1 flex items-center justify-center py-8">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-500"></i>
            </div>
            
            <!-- List -->
            <div id="rankingList" class="flex-1 overflow-y-auto ranking-scroll hidden pr-2 pb-2">
                <!-- Items will be injected here -->
            </div>
            
            <div class="mt-4 pt-4 border-t border-slate-700">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">My Best Score:</span>
                    <span id="myBestScoreDisplay" class="orbitron font-bold text-cyan-400 text-lg">0</span>
                </div>
                <!-- 사용자 이름 설정 입력란 -->
                <div class="mt-3 flex gap-2">
                    <input type="text" id="playerNameInput" placeholder="Enter Name (max 10 chars)" maxlength="10" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                    <button id="btnSaveName" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm transition">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pi-memory-quest';
        let firebaseConfig = null;
        let app, db, auth;
        let currentUser = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                // Mock config for local testing if env vars missing
                console.warn("Using mock firebase config. DB will not work properly.");
                firebaseConfig = { apiKey: "mock", projectId: "mock" };
            }
            
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        // --- CONSTANTS: The glorious Pi ---
        // First 500 digits of Pi
        const PI_STRING = "3.14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196442881097566593344612847564823378678316527120190914564856692346034861045432664821339360726024914127372458700660631558817488152092096282925409171536436789259036001133053054882046652138414695194151160943305727036575959195309218611738193261179310511854807446237996274956735188575272489122793818301194912";
        // We split it to start game logically. Digits to guess starts at index 2 (after '3.')
        const PI_DIGITS = PI_STRING.replace('.', '').substring(1); // "14159..."

        // --- GAME STATE ---
        let state = {
            isPlaying: false,
            mode: 'classic', // classic, suddenDeath, practice
            score: 0,
            lives: 3,
            maxLives: 3,
            currentIndex: 0, // Index in PI_DIGITS
            cards: [], // Array of DOM elements
            soundEnabled: true,
            playerName: localStorage.getItem('piQuestPlayerName') || 'Anonymous'
        };

        // --- AUDIO ENGINE (Tone.js) ---
        let synth, errorSynth;
        let audioInitialized = false;

        async function initAudio() {
            if (audioInitialized) return;
            try {
                await Tone.start();
                
                // Pleasant marimba/xylophone sound for correct digits
                synth = new Tone.PolySynth(Tone.FMSynth, {
                    harmonicity: 8,
                    modulationIndex: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 1 },
                    modulation: { type: "square" },
                    modulationEnvelope: { attack: 0.002, decay: 0.2, sustain: 0, release: 0.2 }
                }).toDestination();
                synth.volume.value = -12;

                // Error sound (dissonant)
                errorSynth = new Tone.MembraneSynth().toDestination();
                errorSynth.volume.value = -5;
                
                audioInitialized = true;
            } catch (e) {
                console.error("Audio init failed:", e);
            }
        }

        function playCorrectSound(digit, combo) {
            if (!state.soundEnabled || !audioInitialized) return;
            // Map digit 0-9 to a musical scale (C major pentatonic + extras)
            // C4, D4, E4, G4, A4, C5, D5, E5, G5, A5
            const notes = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5"];
            const note = notes[parseInt(digit)];
            
            // Increase pitch/velocity slightly based on combo for excitement
            synth.triggerAttackRelease(note, "8n");
        }

        function playErrorSound() {
            if (!state.soundEnabled || !audioInitialized) return;
            errorSynth.triggerAttackRelease("G2", "8n");
        }

        // --- DOM ELEMENTS ---
        const els = {
            belt: document.getElementById('cardsBelt'),
            score: document.getElementById('scoreDisplay'),
            livesContainer: document.getElementById('livesContainer'),
            targetHint: document.getElementById('targetHint'),
            
            // Modals
            menuModal: document.getElementById('menuModal'),
            gameOverModal: document.getElementById('gameOverModal'),
            leaderboardModal: document.getElementById('leaderboardModal'),
            
            // Game Over Data
            finalScore: document.getElementById('finalScore'),
            newBestBadge: document.getElementById('newBestBadge'),
            correctSequence: document.getElementById('correctSequence'),
            gameOverMsg: document.getElementById('gameOverMsg'),
            
            // Leaderboard Data
            rankingList: document.getElementById('rankingList'),
            rankingLoading: document.getElementById('rankingLoading'),
            myBestScoreDisplay: document.getElementById('myBestScoreDisplay'),
            playerNameInput: document.getElementById('playerNameInput'),
            
            // Buttons
            keypad: document.getElementById('keypad'),
            soundIcon: document.getElementById('soundIcon')
        };

        // --- INITIALIZATION ---
        async function init() {
            // Setup Listeners
            setupKeypadListeners();
            setupMenuListeners();
            
            // Keyboard support
            window.addEventListener('keydown', handleKeyPress);

            // Resize support for responsive belt layout
            window.addEventListener('resize', () => {
                if (state.cards.length > 0) updateBeltLayout();
            });
            
            // UI init
            els.playerNameInput.value = state.playerName;
            updateSoundIcon();
            
            // Auth to Firebase
            await authenticateFirebase();
            
            // Load local best for display
            loadLocalBest();
        }

        // --- FIREBASE LOGIC ---
        async function authenticateFirebase() {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                console.log("Firebase Auth Success", currentUser.uid);
                
                // Fetch personal best from Firestore
                fetchMyBest();
            } catch (error) {
                console.error("Firebase Auth Error:", error);
            }
        }

        async function fetchMyBest() {
            if (!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'stats', 'best');
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    const best = docSnap.data().score || 0;
                    localStorage.setItem('piQuestBest', best);
                    els.myBestScoreDisplay.textContent = best;
                }
            } catch (e) {
                console.error("Error fetching best score", e);
            }
        }

        async function saveScoreToFirebase(score) {
            if (!currentUser || !db || state.mode === 'practice' || score === 0) return false;
            
            try {
                // Save Private Best
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'stats', 'best');
                const docSnap = await getDoc(userDocRef);
                let isNewBest = false;
                
                if (!docSnap.exists() || docSnap.data().score < score) {
                    await setDoc(userDocRef, { score: score, date: Date.now() });
                    isNewBest = true;
                    
                    // Save to Public Leaderboard ONLY if it's a new personal best
                    // To keep writes low, we just upsert the user's document in the public collection
                    const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                    await setDoc(publicRef, {
                        uid: currentUser.uid,
                        name: state.playerName,
                        score: score,
                        date: Date.now()
                    });
                }
                return isNewBest;
            } catch (e) {
                console.error("Error saving score", e);
                return false;
            }
        }

        let unsubLeaderboard = null;
        function openLeaderboard() {
            els.leaderboardModal.classList.remove('hidden');
            els.rankingLoading.classList.remove('hidden');
            els.rankingList.classList.add('hidden');
            els.rankingList.innerHTML = '';
            
            if (!db) {
                els.rankingLoading.innerHTML = '<div class="text-red-400 text-sm">Offline Mode</div>';
                return;
            }

            // CRITICAL RULE 1 & 2 Followed: Simple query, strict path
            const leaderboardCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            if (unsubLeaderboard) unsubLeaderboard();
            
            unsubLeaderboard = onSnapshot(leaderboardCol, (snapshot) => {
                const docs = [];
                snapshot.forEach(doc => docs.push(doc.data()));
                
                // Client-side sorting for Top 50
                docs.sort((a, b) => b.score - a.score);
                const topDocs = docs.slice(0, 50);
                
                els.rankingList.innerHTML = '';
                
                if (topDocs.length === 0) {
                    els.rankingList.innerHTML = '<div class="text-center text-slate-500 mt-4">No records yet. Be the first!</div>';
                } else {
                    topDocs.forEach((data, index) => {
                        const isMe = currentUser && data.uid === currentUser.uid;
                        
                        let rankIcon = `<div class="w-6 text-center font-bold text-slate-400">${index + 1}</div>`;
                        if (index === 0) rankIcon = `<div class="w-6 text-center"><i class="fa-solid fa-crown text-yellow-400"></i></div>`;
                        else if (index === 1) rankIcon = `<div class="w-6 text-center"><i class="fa-solid fa-medal text-gray-300"></i></div>`;
                        else if (index === 2) rankIcon = `<div class="w-6 text-center"><i class="fa-solid fa-medal text-amber-600"></i></div>`;

                        const row = document.createElement('div');
                        row.className = `flex justify-between items-center p-3 rounded-lg mb-2 ${isMe ? 'bg-cyan-900/40 border border-cyan-800' : 'bg-slate-700/30'}`;
                        row.innerHTML = `
                            <div class="flex items-center gap-3">
                                ${rankIcon}
                                <div class="font-bold truncate w-24 ${isMe ? 'text-cyan-400' : 'text-white'}">${escapeHtml(data.name || 'Anonymous')}</div>
                            </div>
                            <div class="orbitron font-bold text-lg text-cyan-300">${data.score}</div>
                        `;
                        els.rankingList.appendChild(row);
                    });
                }
                
                els.rankingLoading.classList.add('hidden');
                els.rankingList.classList.remove('hidden');
                
            }, (error) => {
                console.error("Leaderboard Error:", error);
                els.rankingLoading.innerHTML = '<div class="text-red-400 text-sm">Failed to load rankings</div>';
            });
        }
        
        function closeLeaderboard() {
            els.leaderboardModal.classList.add('hidden');
            if (unsubLeaderboard) {
                unsubLeaderboard();
                unsubLeaderboard = null;
            }
        }

        // --- GAME LOGIC ---

        function startGame(mode) {
            initAudio(); // Initialize audio context on first user interaction
            
            state.mode = mode;
            state.isPlaying = true;
            state.score = 0;
            state.currentIndex = 0;
            
            if (mode === 'classic') {
                state.maxLives = 3;
                state.lives = 3;
            } else if (mode === 'suddenDeath') {
                state.maxLives = 1;
                state.lives = 1;
            } else {
                state.maxLives = 3; // Visual only
                state.lives = 3;
            }

            els.menuModal.classList.add('hidden');
            els.gameOverModal.classList.add('hidden');
            
            updateUI();
            initCardsBelt();
            
            // Show target hint briefly
            els.targetHint.classList.remove('opacity-0');
        }

        function initCardsBelt() {
            els.belt.innerHTML = '';
            state.cards = [];
            els.belt.style.transform = `translateX(0px)`;
            
            // Add initial "3." card
            const startCard = createCardElement("3.", "3.", true);
            startCard.classList.add('flipped'); // Always visible
            els.belt.appendChild(startCard);
            state.cards.push(startCard);
            
            // Pre-fill next 5 hidden cards
            for(let i=0; i<5; i++) {
                addCardToBelt(i);
            }

            // 화면 크기에 맞게 패딩 및 위치 동적 초기화
            setTimeout(updateBeltLayout, 0);
        }

        function createCardElement(frontText, backText, isStartNode = false) {
            const container = document.createElement('div');
            container.className = `card-container`;
            
            const card = document.createElement('div');
            card.className = 'card';
            
            const front = document.createElement('div');
            front.className = 'card-face card-front';
            front.innerHTML = frontText;
            
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = backText;
            
            // Optional: If it's a practice mode, show hint on front
            if (state.mode === 'practice' && !isStartNode) {
                front.innerHTML = `<span class="opacity-20 text-sm">${backText}</span>`;
            } else if (!isStartNode) {
                front.innerHTML = '?';
            }
            
            card.appendChild(front);
            card.appendChild(back);
            container.appendChild(card);
            
            return container;
        }

        function addCardToBelt(indexOffset) {
            if (state.currentIndex + indexOffset >= PI_DIGITS.length) return;
            
            const digit = PI_DIGITS[state.currentIndex + indexOffset];
            const cardEl = createCardElement('?', digit);
            els.belt.appendChild(cardEl);
            state.cards.push(cardEl);
        }

        function handleInput(digitStr) {
            if (!state.isPlaying) return;
            
            const correctDigit = PI_DIGITS[state.currentIndex];
            
            // Visual feedback on keypad
            const btn = document.querySelector(`.keypad-btn[data-val="${digitStr}"]`);
            if (btn) {
                btn.classList.add('active-key');
                setTimeout(() => btn.classList.remove('active-key'), 100);
            }

            // check answer
            if (digitStr === correctDigit) {
                handleCorrectAnswer(digitStr);
            } else {
                handleWrongAnswer(correctDigit);
            }
        }

        function handleKeyPress(e) {
            // Ignore if typing in input
            if(document.activeElement.tagName === 'INPUT') return;
            
            const key = e.key;
            // Numpad or normal numbers
            if (/^[0-9]$/.test(key)) {
                handleInput(key);
            }
        }

        function handleCorrectAnswer(digit) {
            playCorrectSound(digit, state.score);
            
            // Get current hidden card (offset by 1 because of "3.")
            const targetCardContainer = state.cards[state.currentIndex + 1];
            const cardInside = targetCardContainer.querySelector('.card');
            
            // Flip it
            cardInside.classList.add('flipped');
            
            // Update state
            state.score++;
            state.currentIndex++;
            updateUI();
            
            // Move belt
            moveBelt();
            
            // Add new card to end of belt to keep it populated
            addCardToBelt(4); 
            
            // Remove old cards from DOM to prevent memory leaks if playing super long
            if (state.currentIndex > 10) {
                const oldCard = state.cards[state.currentIndex - 10];
                if(oldCard && oldCard.parentNode) {
                    // We don't remove from array to keep index sync simple, just hide/remove DOM
                    oldCard.style.opacity = '0';
                    setTimeout(() => { if(oldCard.parentNode) oldCard.parentNode.removeChild(oldCard); }, 300);
                }
            }
        }

        function handleWrongAnswer(correctDigit) {
            playErrorSound();
            
            // Find target card
            const targetCardContainer = state.cards[state.currentIndex + 1];
            const cardInside = targetCardContainer.querySelector('.card');
            
            if (state.mode !== 'practice') {
                state.lives--;
                updateUI();
                
                // Visual Error on card
                cardInside.classList.add('error');
                cardInside.classList.add('flipped');
                
                // Shake the belt container
                els.belt.classList.add('animate-[shake_0.5s_ease-in-out]');
                setTimeout(() => els.belt.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);

                if (state.lives <= 0) {
                    endGame();
                } else {
                    // Briefly show correct number then flip back
                    setTimeout(() => {
                        if(state.isPlaying) {
                            cardInside.classList.remove('flipped');
                            cardInside.classList.remove('error');
                        }
                    }, 1000);
                }
            } else {
                // Practice mode: just show error visually but don't deduct life
                cardInside.classList.add('error');
                cardInside.classList.add('flipped');
                setTimeout(() => {
                    if(state.isPlaying) {
                        cardInside.classList.remove('flipped');
                        cardInside.classList.remove('error');
                    }
                }, 800);
            }
        }

        function moveBelt() {
            if (state.cards.length === 0) return;
            const cardEl = state.cards[0];
            const style = window.getComputedStyle(cardEl);
            const cardWidthWithMargin = cardEl.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
            
            const offset = -(state.currentIndex * cardWidthWithMargin);
            els.belt.style.transform = `translateX(${offset}px)`;
            
            // CSS 애니메이션(오답 쉐이크 효과)을 위한 커스텀 변수 업데이트
            els.belt.style.setProperty('--current-offset', `${offset}px`);
        }

        function updateBeltLayout() {
            if (state.cards.length === 0) return;
            const cardEl = state.cards[0];
            const style = window.getComputedStyle(cardEl);
            const cardWidth = cardEl.offsetWidth;
            const marginLeft = parseFloat(style.marginLeft);
            
            // 첫 번째 카드가 화면 중앙에 오도록 컨테이너의 패딩 동적 계산
            const wrapperWidth = els.belt.parentElement.offsetWidth;
            const paddingLeft = (wrapperWidth / 2) - (cardWidth / 2) - marginLeft;
            els.belt.style.paddingLeft = `${Math.max(0, paddingLeft)}px`;
            
            moveBelt();
        }

        async function endGame() {
            state.isPlaying = false;
            els.targetHint.classList.add('opacity-0');
            
            // Build sequence string to show
            const prefix = "3.";
            const seqStr = PI_DIGITS.substring(0, state.currentIndex + 5); // Show up to where they missed + a few more
            let coloredSeq = prefix;
            
            for(let i=0; i<seqStr.length; i++) {
                if (i < state.currentIndex) {
                    coloredSeq += `<span class="text-cyan-400">${seqStr[i]}</span>`;
                } else if (i === state.currentIndex) {
                    coloredSeq += `<span class="text-red-500 font-bold underline bg-red-900/30">${seqStr[i]}</span>`;
                } else {
                    coloredSeq += `<span class="text-slate-600">${seqStr[i]}</span>`;
                }
            }
            if(seqStr.length < PI_DIGITS.length) coloredSeq += "...";
            
            els.correctSequence.innerHTML = coloredSeq;
            els.finalScore.textContent = state.score;
            els.gameOverMsg.textContent = state.mode === 'suddenDeath' ? "One mistake is all it takes!" : "Out of lives!";
            
            // Save Score
            let localBest = parseInt(localStorage.getItem('piQuestBest') || '0');
            let isNewBest = false;
            
            if (state.mode !== 'practice' && state.score > localBest) {
                localStorage.setItem('piQuestBest', state.score);
                isNewBest = true;
            }
            
            const isCloudNewBest = await saveScoreToFirebase(state.score);
            
            if (isNewBest || isCloudNewBest) {
                els.newBestBadge.classList.remove('hidden');
                els.myBestScoreDisplay.textContent = state.score;
            } else {
                els.newBestBadge.classList.add('hidden');
            }

            setTimeout(() => {
                els.gameOverModal.classList.remove('hidden');
            }, 800);
        }

        function updateUI() {
            els.score.textContent = state.score;
            
            // Update Lives
            if (state.mode === 'practice') {
                els.livesContainer.innerHTML = '<i class="fa-solid fa-infinity text-slate-500"></i>';
            } else {
                let heartsHtml = '';
                for (let i = 0; i < state.maxLives; i++) {
                    if (i < state.lives) {
                        heartsHtml += '<i class="fa-solid fa-heart heart"></i>';
                    } else {
                        heartsHtml += '<i class="fa-solid fa-heart heart lost"></i>';
                    }
                }
                els.livesContainer.innerHTML = heartsHtml;
            }
        }

        // --- UTILS & EVENT BINDINGS ---
        function setupKeypadListeners() {
            // Numpad buttons
            document.querySelectorAll('.keypad-btn[data-val]').forEach(btn => {
                // Support both touch and click, prevent default to avoid double firing
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(btn.dataset.val); }, {passive: false});
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(btn.dataset.val); });
            });
        }

        function setupMenuListeners() {
            // Main Menu
            document.getElementById('btnModeClassic').addEventListener('click', () => startGame('classic'));
            document.getElementById('btnModeSuddenDeath').addEventListener('click', () => startGame('suddenDeath'));
            document.getElementById('btnModePractice').addEventListener('click', () => startGame('practice'));
            
            document.getElementById('btnToggleSound').addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                updateSoundIcon();
            });

            // Game Over Menu
            document.getElementById('btnRestart').addEventListener('click', () => startGame(state.mode));
            document.getElementById('btnGoMenu').addEventListener('click', () => {
                els.gameOverModal.classList.add('hidden');
                els.menuModal.classList.remove('hidden');
            });

            // Leaderboard
            document.getElementById('btnMenuLeaderboard').addEventListener('click', openLeaderboard);
            document.getElementById('btnLeaderboard').addEventListener('click', openLeaderboard);
            document.getElementById('btnCloseLeaderboard').addEventListener('click', closeLeaderboard);
            
            // Options (In-game menu button)
            document.getElementById('btnOptions').addEventListener('click', () => {
                if(state.isPlaying) {
                    state.isPlaying = false; // Pause input
                }
                els.menuModal.classList.remove('hidden');
            });
            
            // Name Save
            document.getElementById('btnSaveName').addEventListener('click', async () => {
                const newName = els.playerNameInput.value.trim().substring(0, 10);
                if (newName) {
                    state.playerName = newName;
                    localStorage.setItem('piQuestPlayerName', newName);
                    
                    // If user has a score, update the leaderboard doc directly to reflect new name
                    if (currentUser && db && parseInt(els.myBestScoreDisplay.textContent) > 0) {
                        try {
                            const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                            await setDoc(publicRef, { name: newName }, { merge: true });
                        } catch(e) { console.error(e); }
                    }
                    
                    const btn = document.getElementById('btnSaveName');
                    const oldText = btn.textContent;
                    btn.textContent = 'Saved!';
                    btn.classList.add('bg-green-600');
                    setTimeout(() => {
                        btn.textContent = oldText;
                        btn.classList.remove('bg-green-600');
                    }, 2000);
                }
            });
        }

        function updateSoundIcon() {
            if (state.soundEnabled) {
                els.soundIcon.className = "fa-solid fa-volume-high mb-1 text-cyan-400";
            } else {
                els.soundIcon.className = "fa-solid fa-volume-xmark mb-1 text-slate-500";
            }
        }

        function loadLocalBest() {
            const best = localStorage.getItem('piQuestBest') || 0;
            els.myBestScoreDisplay.textContent = best;
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Add CSS keyframes for shaking
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(calc(var(--current-offset, 0px))) }
                25% { transform: translateX(calc(var(--current-offset, 0px) - 5px)) }
                50% { transform: translateX(calc(var(--current-offset, 0px) + 5px)) }
                75% { transform: translateX(calc(var(--current-offset, 0px) - 5px)) }
            }
        `;
        document.head.appendChild(style);

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
