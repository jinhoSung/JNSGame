        const Trophy = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 21h8m-4-9v9m-8-2.5a6 6 0 0 1 12 0v2.5"></path><path d="M16 3h-8"></path><path d="M7 3v7a5 5 0 0 0 10 0V3"></path><path d="M19 6h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-2"></path><path d="M5 6H3a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h2"></path></svg>);
        const Hash = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>);
        const Radar = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>);
        const MapIcon = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>);
        const Volume2 = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>);
        const VolumeX = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>);
        const ShoppingCart = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>);

        const Flag = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>);
        const Car = ({size=24, className=""}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H5.3a2 2 0 0 0-1.6.8L1 11l-5.16.86a1 1 0 0 0-.84.99V16h3m10 0a2 2 0 1 1-4 0m10 0a2 2 0 1 1-4 0"></path></svg>);

        // --- Config & Constants ---
        const TRACK_WIDTH = 800;
        const TRACK_HEIGHT = 600;
        const CAR_SIZE = { width: 24, height: 14 };
        const MAP_SCALE = 0.85;
        const MAX_SKID_MARKS = 50; 
        const TOTAL_LAPS = 3;
        const STORAGE_KEY = 'racing_game_v11_records_storage'; 

        const CHECKPOINT_RADIUS_NORMAL = 120; 
        const TRACK_AESTHETICS = { border: 90, curb: 80, asphalt: 70 };

        const SENSOR_ANGLES = [-90, -45, -20, 0, 20, 45, 90];
        const SENSOR_SPEED_ID = 99;
        const SENSOR_CTE_ID = 100; 
        const SENSOR_CURVE_ID = 101; 

        const SENSOR_SELECT_LABELS = { 
            0: '좌측 (90°)', 1: '전좌측 (45°)', 2: '전좌측 (20°)', 3: '전방 (0°)', 
            4: '전우측 (20°)', 5: '전우측 (45°)', 6: '우측 (90°)',
            [SENSOR_SPEED_ID]: '속도 (Speed)',
            [SENSOR_CTE_ID]: '차선 이탈 (CTE)',
            [SENSOR_CURVE_ID]: '커브 각도 (Curve)'
        };

        const OPERATOR_OPTIONS = [
            { value: '<', label: '작다면 (<)' }, { value: '>', label: '크다면 (>)' }, 
            { value: '<=', label: '같거나 작다면 (<=)' }, { value: '>=', label: '같거나 크다면 (>=)' }, 
            { value: '==', label: '같다면 (==)' }, { value: '!=', label: '같지 않다면 (!=)' },
        ];

        const FLOW_OPTIONS = [
            { value: 'IF', label: '만약 (IF)', color: 'border-blue-500' },
            { value: 'ELSE_IF', label: '아니면 만약 (ELSE IF)', color: 'border-indigo-500' },
            { value: 'ELSE', label: '아니면 (ELSE)', color: 'border-purple-500' },
        ];

        const ACTION_TYPES = [
            { value: 'AUTO_STEER', label: '★ 중앙선 유지 조향' },
            { value: 'STEER', label: '수동 조향각 설정 (Steer)' },
            { value: 'THROTTLE', label: '가감속 설정 (Throttle)' }
        ];

        const INITIAL_BLOCKS = [
          { id: 1, flowType: 'IF', sensor: SENSOR_SPEED_ID, operator: '>=', valueType: 'number', value: 0, multiplier: 100, actionType: 'AUTO_STEER', actionValue: 0 }, 
          { id: 2, flowType: 'IF', sensor: SENSOR_CURVE_ID, operator: '>', valueType: 'number', value: 30, multiplier: 100, actionType: 'THROTTLE', actionValue: -100 }, 
          { id: 3, flowType: 'ELSE_IF', sensor: SENSOR_CURVE_ID, operator: '<', valueType: 'number', value: -30, multiplier: 100, actionType: 'THROTTLE', actionValue: -100 }, 
          { id: 4, flowType: 'ELSE', sensor: SENSOR_SPEED_ID, operator: '>', valueType: 'number', value: 0, multiplier: 100, actionType: 'THROTTLE', actionValue: 100 } 
        ];

        const PART_TYPES = [
            { id: 'engine', name: '엔진', unit: '가속력 (Accel)' },
            { id: 'gearbox', name: '변속기', unit: '최고속도 (Max Speed)' },
            { id: 'brakes', name: '브레이크', unit: '제동력 (Braking Power)' },
            { id: 'tire', name: '타이어', unit: '마찰력 (Friction)' },
            { id: 'steering', name: '스티어링', unit: '조향 속도 (Turn Speed)' },
            { id: 'downforce', name: '다운포스 윙', unit: '접지력 (Grip)' },
            { id: 'sensor', name: '센서 모듈', unit: '센서 범위 (Range)' },
        ];
         
        const PART_STATS = {
            '0': { acceleration: 0.6, maxSpeedMod: 8.0, brakePower: 1.0, friction: 0.93, turnSpeed: 0.08, gripFactor: 0.05, sensorRange: 150 },
            '1': { acceleration: 0.75, maxSpeedMod: 10.0, brakePower: 1.3, friction: 0.94, turnSpeed: 0.10, gripFactor: 0.10, sensorRange: 200, price: 1500 },
            '2': { acceleration: 0.9, maxSpeedMod: 12.0, brakePower: 1.6, friction: 0.95, turnSpeed: 0.12, gripFactor: 0.15, sensorRange: 250, price: 3000 },
            '3': { acceleration: 1.1, maxSpeedMod: 14.5, brakePower: 2.0, friction: 0.96, turnSpeed: 0.14, gripFactor: 0.20, sensorRange: 300, price: 5000 }
        };

        const CAR_CHASSIS = [
            { id: 'C01', name: '기본 모델 (Blue)', price: 0, color: '#3b82f6', baseAccel: 0.7, baseGrip: 0.05, maxSpeedBonus: 0 },
            { id: 'C02', name: '스포트 경량 (Red)', price: 10000, color: '#ef4444', baseAccel: 0.8, baseGrip: 0.08, maxSpeedBonus: 1 },
            { id: 'C03', name: '하이 그립 (Green)', price: 25000, color: '#10b981', baseAccel: 0.75, baseGrip: 0.12, maxSpeedBonus: 0 },
        ];

        const TRACK_LAYOUTS = [
            { id: 'technical', name: '1. 테크니컬 서킷 (초급)', points: [{ x: 350, y: 100 }, { x: 500, y: 50 }, { x: 700, y: 100 }, { x: 750, y: 200 }, { x: 700, y: 300 }, { x: 600, y: 350 }, { x: 700, y: 500 }, { x: 500, y: 550 }, { x: 300, y: 500 }, { x: 150, y: 450 }, { x: 50, y: 300 }, { x: 100, y: 100 }, { x: 200, y: 100 }] },
            { id: 'oval', name: '2. 스피드 오벌 (입문)', points: [{ x: 400, y: 100 }, { x: 650, y: 100 }, { x: 750, y: 300 }, { x: 650, y: 500 }, { x: 150, y: 500 }, { x: 50, y: 300 }, { x: 150, y: 100 }] },
            { id: 'slalom_long', name: '3. 슈퍼 슬라롬 (최상급)', points: [{ x: 400, y: 100 }, { x: 750, y: 100 }, { x: 750, y: 250 }, { x: 600, y: 350 }, { x: 750, y: 450 }, { x: 750, y: 500 }, { x: 400, y: 550 }, { x: 50, y: 500 }, { x: 50, y: 450 }, { x: 200, y: 350 }, { x: 50, y: 250 }, { x: 50, y: 100 }] },
        ];

        const getPhysicsConstants = (userParts, currentChassisId) => {
            const currentChassis = CAR_CHASSIS.find(c => c.id === currentChassisId) || CAR_CHASSIS[0];
            return {
                acceleration: PART_STATS[userParts.engine]?.acceleration || 0.6,
                maxSpeed: (PART_STATS[userParts.gearbox]?.maxSpeedMod || 8) + currentChassis.maxSpeedBonus, 
                brakePower: PART_STATS[userParts.brakes]?.brakePower || 1.0,
                friction: PART_STATS[userParts.tire]?.friction || 0.93,
                turnSpeed: PART_STATS[userParts.steering]?.turnSpeed || 0.08,
                gripFactor: PART_STATS[userParts.downforce]?.gripFactor || 0.05,
                sensorRange: PART_STATS[userParts.sensor]?.sensorRange || 150,
            };
        };

        const getDefaultUserData = () => ({
            dollars: 5000, 
            currentChassis: CAR_CHASSIS[0].id,
            ownedChassis: [CAR_CHASSIS[0].id],
            parts: { engine: 0, gearbox: 0, brakes: 0, tire: 0, steering: 0, downforce: 0, sensor: 0 },
            bestRecords: {}, // 맵별 최고 기록 저장소
            blocks: INITIAL_BLOCKS // 로직 자동저장을 위해 userData에 편입
        });

        const getPartStatKey = (partId) => {
            switch(partId) {
                case 'engine': return 'acceleration';
                case 'gearbox': return 'maxSpeedMod';
                case 'brakes': return 'brakePower';
                case 'tire': return 'friction';
                case 'steering': return 'turnSpeed';
                case 'downforce': return 'gripFactor';
                case 'sensor': return 'sensorRange';
                default: return '';
            }
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('race');
            const [isPlaying, setIsPlaying] = useState(false);
            const [gameState, setGameState] = useState('idle');
            const [userRank, setUserRank] = useState(null);
            const [sensorReadings, setSensorReadings] = useState(new Array(7).fill(0).concat([0, 0, 0]));
            const [currentTrackIdx, setCurrentTrackIdx] = useState(0);
            const [carsInitialized, setCarsInitialized] = useState(false);
            
            const [userData, setUserData] = useState(getDefaultUserData());
            const [physics, setPhysics] = useState(getPhysicsConstants(getDefaultUserData().parts, CAR_CHASSIS[0].id));

            const [userStats, setUserStats] = useState({ 
                laps: 0, currentLapTime: 0, lastLapTime: 0, totalTime: 0, lapHistory: []
            });

            const canvasRef = useRef(null);
            const cars = useRef([]);
            const requestRef = useRef();
            const startTimeRef = useRef(0);
            const raceStandings = useRef([]);

            // 데이터 불러오기
            useEffect(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsedData = JSON.parse(stored);
                        // 하위 호환성 패치
                        if (!parsedData.parts.brakes) parsedData.parts.brakes = 0;
                        if (!parsedData.ownedChassis) parsedData.ownedChassis = ['C01'];
                        if (!parsedData.bestRecords) parsedData.bestRecords = {};
                        if (!parsedData.blocks) parsedData.blocks = INITIAL_BLOCKS;
                        
                        setUserData(parsedData);
                    }
                } catch (e) { console.error(e); }
            }, []);

            // 물리 상수 업데이트
            useEffect(() => {
                setPhysics(getPhysicsConstants(userData.parts, userData.currentChassis));
            }, [userData.parts, userData.currentChassis]);

            // 데이터 저장 헬퍼
            const saveLocalData = (data) => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
            };

            // 블록 상태 업데이트 및 즉시 저장
            const updateBlocks = (newBlocks) => {
                const newData = { ...userData, blocks: newBlocks };
                setUserData(newData);
                saveLocalData(newData);
            };

            const updateSingleBlock = (id, field, value) => {
                const newBlocks = userData.blocks.map(b => b.id === id ? { ...b, [field]: value } : b);
                updateBlocks(newBlocks);
            };

            const toggleValueType = (id) => {
                const newBlocks = userData.blocks.map(b => {
                    if (b.id === id) {
                        const newType = b.valueType === 'number' ? 'sensor' : 'number';
                        const newValue = newType === 'number' ? 50 : 0; 
                        return { ...b, valueType: newType, value: newValue };
                    }
                    return b;
                });
                updateBlocks(newBlocks);
            };

            // 수학 함수
            const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            const scalePoint = useCallback((p) => ({
                x: (p.x - TRACK_WIDTH / 2) * MAP_SCALE + TRACK_WIDTH / 2,
                y: (p.y - TRACK_HEIGHT / 2) * MAP_SCALE + TRACK_HEIGHT / 2
            }), []);
            const getCurrentTrackPoints = useCallback(() => TRACK_LAYOUTS[currentTrackIdx].points.map(scalePoint), [currentTrackIdx, scalePoint]);

            const isOffTrack = (x, y) => {
                const points = getCurrentTrackPoints();
                let minDist = Infinity;
                for (let i = 0; i < points.length; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % points.length];
                    const d = distToSegment(x, y, p1.x, p1.y, p2.x, p2.y);
                    if (d < minDist) minDist = d;
                }
                return minDist > (TRACK_AESTHETICS.curb / 2) + 3; 
            };

            const distToSegment = (x, y, x1, y1, x2, y2) => {
                const A = x - x1, B = y - y1, C = x2 - x1, D = y2 - y1;
                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;
                let xx, yy;
                if (param < 0) { xx = x1; yy = y1; }
                else if (param > 1) { xx = x2; yy = y2; }
                else { xx = x1 + param * C; yy = y1 + param * D; }
                return dist(x, y, xx, yy);
            };

            const getTrackSensorData = (car) => {
                const points = getCurrentTrackPoints();
                const len = points.length;
                
                const candidateIndices = [car.lastCP % len, (car.lastCP + 1) % len];
                let minDist = Infinity;
                let closestSegmentIdx = car.lastCP % len;
                
                candidateIndices.forEach(idx => {
                    const p1 = points[idx];
                    const p2 = points[(idx + 1) % len];
                    const C = p2.x - p1.x, D = p2.y - p1.y;
                    const dot = (car.x - p1.x) * C + (car.y - p1.y) * D;
                    const lenSq = C * C + D * D;
                    const param = lenSq !== 0 ? Math.max(0, Math.min(1, dot / lenSq)) : 0;
                    const px = p1.x + param * C;
                    const py = p1.y + param * D;
                    const d = dist(car.x, car.y, px, py);
                    
                    if (d < minDist) {
                        minDist = d;
                        closestSegmentIdx = idx;
                    }
                });

                const p1 = points[closestSegmentIdx];
                const p2 = points[(closestSegmentIdx + 1) % len];
                
                const C = p2.x - p1.x;
                const D = p2.y - p1.y;
                const segmentLen = Math.sqrt(C * C + D * D) || 1;
                
                const crossProduct = C * (car.y - p1.y) - D * (car.x - p1.x);
                const cte = crossProduct / segmentLen; 
                
                const targetAngle = Math.atan2(D, C);

                const p3 = points[(closestSegmentIdx + 2) % len];
                const nextTargetAngle = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                
                let curveDiff = nextTargetAngle - targetAngle;
                while (curveDiff <= -Math.PI) curveDiff += Math.PI * 2;
                while (curveDiff > Math.PI) curveDiff -= Math.PI * 2;
                
                const curveAngleDeg = curveDiff * (180 / Math.PI);

                return { cte, targetAngle, curveAngleDeg };
            };

            const castRays = (car, range) => {
                const readings = [];
                SENSOR_ANGLES.forEach(offset => {
                    const rayAngle = car.angle + (offset * Math.PI / 180);
                    let distance = 0;
                    let step = 5; 
                    let rx = car.x, ry = car.y;
                    while (distance < range) {
                        rx += Math.cos(rayAngle) * step;
                        ry += Math.sin(rayAngle) * step;
                        distance += step;
                        if (isOffTrack(rx, ry)) break;
                    }
                    readings.push(Math.min(distance, range));
                });
                return readings;
            };

            const updateCarPhysics = (car, inputs, timestamp) => {
                if (car.finished) return;

                const carPhysics = car.isAI ? PART_STATS['0'] : physics;
                
                if (Math.abs(car.speed) > 0.5) {
                    car.angle += inputs.steer * carPhysics.turnSpeed * (car.speed > 0 ? 1 : -1);
                }

                if (car.moveAngle === undefined) car.moveAngle = car.angle;
                if (car.skidMarks === undefined) car.skidMarks = [];

                const speedRatio = Math.abs(car.speed) / (carPhysics.maxSpeed || 1); 
                const grip = carPhysics.gripFactor + (1.0 - speedRatio) * (1 - carPhysics.gripFactor); 

                let angleDiff = car.angle - car.moveAngle;
                while (angleDiff <= -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

                car.moveAngle += angleDiff * grip;
                
                let actualThrottle = inputs.throttle;
                if (actualThrottle < 0) {
                    actualThrottle *= carPhysics.brakePower; 
                }
                car.speed += actualThrottle * carPhysics.acceleration;
                car.speed *= carPhysics.friction;

                const driftIntensity = Math.abs(angleDiff);
                if (driftIntensity > 0.15 && Math.abs(car.speed) > 3) {
                    car.speed *= (1 - driftIntensity * 0.05);
                    const rearX = car.x - Math.cos(car.angle) * 10, rearY = car.y - Math.sin(car.angle) * 10;
                    const perp = car.angle + Math.PI/2;
                    car.skidMarks.push({ 
                        lx: rearX + Math.cos(perp)*6, ly: rearY + Math.sin(perp)*6, 
                        rx: rearX - Math.cos(perp)*6, ry: rearY - Math.sin(perp)*6 
                    });
                    if (car.skidMarks.length > MAX_SKID_MARKS) car.skidMarks.shift(); 
                }

                if (car.speed > carPhysics.maxSpeed) car.speed = carPhysics.maxSpeed;
                if (car.speed < -carPhysics.maxSpeed / 2) car.speed = -carPhysics.maxSpeed / 2;

                car.x += Math.cos(car.moveAngle) * car.speed;
                car.y += Math.sin(car.moveAngle) * car.speed;

                if (isOffTrack(car.x, car.y)) car.speed *= 0.4; 

                const points = getCurrentTrackPoints();
                const nextCpIdx = (car.lastCP + 1) % points.length;
                const nextCp = points[nextCpIdx];
                
                let isReached = false;
                if (nextCpIdx === 0) {
                    const trackAngle = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
                    const localX = (car.x - points[0].x) * Math.cos(-trackAngle) - (car.y - points[0].y) * Math.sin(-trackAngle);
                    const localY = (car.x - points[0].x) * Math.sin(-trackAngle) + (car.y - points[0].y) * Math.cos(-trackAngle);
                    if (Math.abs(localX) < 20 && Math.abs(localY) < 45) isReached = true;
                } else {
                    if (dist(car.x, car.y, nextCp.x, nextCp.y) < CHECKPOINT_RADIUS_NORMAL) isReached = true;
                }

                if (isReached) {
                    car.lastCP = nextCpIdx;
                    if (nextCpIdx === 0) {
                        car.laps++;
                        const lapTime = (timestamp - car.lapStartTime) / 1000;
                        car.lastLapTime = lapTime;
                        car.lapStartTime = timestamp; 
                        
                        if (car.id === 'user') {
                            if (!car.lapHistory) car.lapHistory = [];
                            car.lapHistory.push(lapTime);
                        }

                        if (car.laps >= TOTAL_LAPS) {
                            car.finished = true;
                            car.finishTime = (timestamp - startTimeRef.current) / 1000;
                            
                            if (!raceStandings.current.includes(car.id)) {
                                raceStandings.current.push(car.id);
                            }
                            
                            if (car.id === 'user') {
                                const rank = raceStandings.current.findIndex(id => id === 'user') + 1;
                                setUserRank(rank);
                                
                                // 최고 기록 저장 처리
                                const trackId = TRACK_LAYOUTS[currentTrackIdx].id;
                                let newBestRecords = { ...userData.bestRecords };
                                if (!newBestRecords[trackId] || car.finishTime < newBestRecords[trackId]) {
                                    newBestRecords[trackId] = car.finishTime;
                                }

                                // 보상 계산
                                let reward = 0;
                                if (rank === 1) reward = 3000;
                                else if (rank === 2) reward = 1500;
                                else if (rank === 3) reward = 800;
                                else reward = 200;

                                const updatedData = {
                                    ...userData, 
                                    dollars: userData.dollars + reward,
                                    bestRecords: newBestRecords
                                };
                                
                                setUserData(updatedData);
                                saveLocalData(updatedData);

                                setGameState('finished');
                                setIsPlaying(false);
                            }
                        }
                    }
                }
            };

            const evaluateCondition = (block, sensorDataObj) => {
                if (block.flowType === 'ELSE') return false; 
                
                let leftValue = sensorDataObj[block.sensor] || 0;
                let rightValue = block.valueType === 'sensor' 
                    ? (sensorDataObj[block.value] || 0) * ((block.multiplier || 100) / 100) 
                    : block.value;

                switch(block.operator) {
                    case '<': return leftValue < rightValue;
                    case '>': return leftValue > rightValue;
                    case '<=': return leftValue <= rightValue;
                    case '>=': return leftValue >= rightValue;
                    case '==': return leftValue === rightValue;
                    case '!=': return leftValue !== rightValue;
                    default: return false;
                }
            };
            
            const applyAction = (block, steerOutputs, car, trackData) => {
                switch(block.actionType) {
                    case 'AUTO_STEER':
                        let angleErr = trackData.targetAngle - car.angle;
                        while(angleErr <= -Math.PI) angleErr += Math.PI * 2;
                        while(angleErr > Math.PI) angleErr -= Math.PI * 2;
                        const cteCorrection = -trackData.cte * 0.04; 
                        const finalSteer = (angleErr * 0.8) + cteCorrection;
                        steerOutputs.steer = Math.max(-1, Math.min(1, finalSteer * 2.5)); 
                        break;
                    case 'STEER':
                        steerOutputs.steer = Math.max(-1, Math.min(1, (block.actionValue || 0) / 100));
                        break;
                    case 'THROTTLE':
                        steerOutputs.throttle = Math.max(-1, Math.min(1, (block.actionValue || 0) / 100));
                        break;
                }
            }

            const getUserInputs = (car) => {
                const steerOutputs = { steer: 0, throttle: 0 }; 
                
                const rayReadings = castRays(car, physics.sensorRange);
                const trackData = getTrackSensorData(car);
                
                const sensorDataObj = {
                    ...rayReadings.reduce((acc, val, idx) => ({ ...acc, [idx]: val }), {}),
                    [SENSOR_SPEED_ID]: Math.abs(car.speed) * 10,
                    [SENSOR_CTE_ID]: trackData.cte,
                    [SENSOR_CURVE_ID]: trackData.curveAngleDeg
                };

                setSensorReadings(rayReadings.concat([sensorDataObj[SENSOR_SPEED_ID], trackData.cte, trackData.curveAngleDeg]));

                let matchedInChain = false; 
                for (let i = 0; i < userData.blocks.length; i++) {
                    const block = userData.blocks[i];
                    const conditionMet = evaluateCondition(block, sensorDataObj);
                    const isStart = block.flowType === 'IF';
                    
                    if (isStart) matchedInChain = false;

                    if ((isStart && conditionMet) || (block.flowType === 'ELSE_IF' && !matchedInChain && conditionMet) || (block.flowType === 'ELSE' && !matchedInChain)) {
                        applyAction(block, steerOutputs, car, trackData);
                        matchedInChain = true; 
                    }
                }
                return steerOutputs;
            };

            const getAIInputs = (car) => {
                const trackData = getTrackSensorData(car);
                let angleErr = trackData.targetAngle - car.angle;
                while(angleErr <= -Math.PI) angleErr += Math.PI * 2;
                while(angleErr > Math.PI) angleErr -= Math.PI * 2;
                
                const cteCorrection = -trackData.cte * 0.04;
                const steer = Math.max(-1, Math.min(1, (angleErr * 0.8 + cteCorrection) * 2.5));

                let throttle = 1;
                if (Math.abs(trackData.curveAngleDeg) > 30) throttle = -0.5; 
                
                const variance = (parseInt(car.id.slice(-1)) || 0) * 0.05;
                return { steer, throttle: throttle - variance };
            };

            const update = (timestamp) => {
                if (gameState === 'finished') return;
                if (startTimeRef.current === 0) {
                    startTimeRef.current = timestamp;
                    cars.current.forEach(c => c.lapStartTime = timestamp);
                }
                
                const userCar = cars.current.find(c => c.id === 'user');
                if (!userCar || cars.current.length === 0) return;

                const userInputs = getUserInputs(userCar);
                updateCarPhysics(userCar, userInputs, timestamp);
                
                cars.current.filter(c => c.id !== 'user').forEach(car => updateCarPhysics(car, getAIInputs(car), timestamp));

                setUserStats(prev => ({
                    ...prev, laps: userCar.laps || 0,
                    currentLapTime: (timestamp - userCar.lapStartTime) / 1000 || 0,
                    lastLapTime: userCar.lastLapTime || 0,
                    totalTime: userCar.finished ? userCar.finishTime : (timestamp - startTimeRef.current) / 1000,
                    lapHistory: userCar.lapHistory || [] 
                }));

                draw();
                if (isPlaying) requestRef.current = requestAnimationFrame(update);
            };

            const draw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#1e293b'; 
                ctx.fillRect(0, 0, TRACK_WIDTH, TRACK_HEIGHT);

                if (cars.current.length === 0) return;
                const points = getCurrentTrackPoints();
                
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = TRACK_AESTHETICS.border;
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();

                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = TRACK_AESTHETICS.curb; ctx.stroke();
                ctx.strokeStyle = '#334155'; ctx.lineWidth = TRACK_AESTHETICS.asphalt; ctx.stroke();

                ctx.strokeStyle = '#fbbf24'; 
                ctx.lineWidth = 3;
                ctx.setLineDash([15, 15]); 
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
                ctx.setLineDash([]);

                cars.current.forEach(car => {
                    if (car.skidMarks && car.skidMarks.length > 1) {
                        ctx.lineWidth = 4; ctx.strokeStyle = `rgba(10, 10, 10, 0.4)`; 
                        for(let i=0; i<car.skidMarks.length-1; i++) {
                            const p1 = car.skidMarks[i], p2 = car.skidMarks[i+1];
                            ctx.beginPath(); ctx.moveTo(p1.lx, p1.ly); ctx.lineTo(p2.lx, p2.ly); ctx.stroke();
                            ctx.beginPath(); ctx.moveTo(p1.rx, p1.ry); ctx.lineTo(p2.rx, p2.ry); ctx.stroke();
                        }
                    }
                });

                const startAngle = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
                ctx.save(); ctx.translate(points[0].x, points[0].y); ctx.rotate(startAngle); 
                ctx.fillStyle = '#fff'; ctx.fillRect(-10, -40, 20, 80); 
                ctx.fillStyle = '#000';
                for(let i=0; i<8; i++) for(let j=0; j<2; j++) if((i+j)%2===0) ctx.fillRect(-10 + j*10, -40 + i*10, 10, 10);
                ctx.restore();

                // 등수별 정렬을 위해 x좌표 등 활용 가능하나 임시로 그냥 그림
                cars.current.forEach(car => {
                    if (!car || isNaN(car.x) || isNaN(car.y)) return;
                    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);

                    ctx.fillStyle = car.color; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
                    ctx.fillRect(-CAR_SIZE.width/2, -CAR_SIZE.height/2, CAR_SIZE.width, CAR_SIZE.height);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(2, -5, 6, 10);
                    
                    if (car.id === 'user') {
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                        ctx.strokeRect(-CAR_SIZE.width/2, -CAR_SIZE.height/2, CAR_SIZE.width, CAR_SIZE.height);
                    }
                    
                    ctx.restore();
                });
            };

            const initializeCars = useCallback(() => {
                const points = getCurrentTrackPoints();
                const startAngle = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
                const px = Math.cos(startAngle + Math.PI/2), py = Math.sin(startAngle + Math.PI/2);
                const dx = Math.cos(startAngle), dy = Math.sin(startAngle);
                
                const spawnX = points[0].x - dx * 40, spawnY = points[0].y - dy * 40;
                const userChassis = CAR_CHASSIS.find(c => c.id === userData.currentChassis) || CAR_CHASSIS[0]; 
                
                cars.current = [
                    { id: 'user', x: spawnX + px * 12, y: spawnY + py * 12, angle: startAngle, moveAngle: startAngle, speed: 0, color: userChassis.color, chassisId: userChassis.id, isAI: false, laps: 0, lastCP: 0, finished: false, lapStartTime: 0, lapHistory: [], skidMarks: [] },
                    { id: 'ai1', x: spawnX - px * 12, y: spawnY - py * 12, angle: startAngle, moveAngle: startAngle, speed: 0, color: '#ef4444', isAI: true, laps: 0, lastCP: 0, finished: false, lapStartTime: 0, skidMarks: [] },
                    { id: 'ai2', x: spawnX - dx * 30 + px * 12, y: spawnY - dy * 30 + py * 12, angle: startAngle, moveAngle: startAngle, speed: 0, color: '#f59e0b', isAI: true, laps: 0, lastCP: 0, finished: false, lapStartTime: 0, skidMarks: [] },
                    { id: 'ai3', x: spawnX - dx * 30 - px * 12, y: spawnY - dy * 30 - py * 12, angle: startAngle, moveAngle: startAngle, speed: 0, color: '#8b5cf6', isAI: true, laps: 0, lastCP: 0, finished: false, lapStartTime: 0, skidMarks: [] }
                ];
                raceStandings.current = [];
                setCarsInitialized(true); draw(); 
            }, [getCurrentTrackPoints, userData]);

            const resetGame = useCallback(() => {
                setIsPlaying(false); setGameState('idle'); setUserRank(null);
                startTimeRef.current = 0;
                setUserStats({ laps: 0, currentLapTime: 0, lastLapTime: 0, totalTime: 0, lapHistory: [] });
                initializeCars(); 
            }, [initializeCars]);
            
            const togglePlay = () => {
                if (!carsInitialized) initializeCars();
                if (gameState === 'finished' || gameState === 'idle') resetGame();
                
                const nextIsPlaying = !isPlaying;
                if (nextIsPlaying) {
                    setGameState('running');
                    if (startTimeRef.current === 0) startTimeRef.current = performance.now();
                } else {
                    setGameState('idle');
                }
                setIsPlaying(nextIsPlaying);
            };

            useEffect(() => {
                if (isPlaying) requestRef.current = requestAnimationFrame(update);
                else { cancelAnimationFrame(requestRef.current); draw(); }
                return () => { cancelAnimationFrame(requestRef.current); };
            }, [isPlaying, userData.blocks, gameState, physics]);

            useEffect(() => { initializeCars(); }, [initializeCars]);

            // --- 상점 시스템 로직 ---
            const purchasePart = (partId, currentTier) => {
                const nextTier = currentTier + 1;
                const nextStats = PART_STATS[nextTier];
                if (!nextStats || userData.dollars < nextStats.price) return;

                const newDollars = userData.dollars - nextStats.price;
                const newParts = { ...userData.parts, [partId]: nextTier };
                const updatedData = { ...userData, dollars: newDollars, parts: newParts };
                
                setUserData(updatedData);
                saveLocalData(updatedData);
            };

            const purchaseChassis = (chassisId, price) => {
                let updatedData = { ...userData };
                if (userData.ownedChassis.includes(chassisId)) {
                    if (userData.currentChassis === chassisId) return;
                    updatedData.currentChassis = chassisId;
                } else {
                    if (userData.dollars < price) return;
                    updatedData.dollars -= price;
                    updatedData.ownedChassis.push(chassisId);
                    updatedData.currentChassis = chassisId;
                }
                setUserData(updatedData);
                saveLocalData(updatedData);
            };

            // --- 상점 UI 컴포넌트 ---
            const ShopScreen = () => {
                return (
                    <div className="p-4 lg:p-8 overflow-y-auto no-scrollbar w-full h-full bg-[#0f172a] text-slate-200">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                            <h1 className="text-3xl font-extrabold text-yellow-400 flex items-center gap-3">
                                <ShoppingCart size={30} /> GARAGE
                            </h1>
                            <div className="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-600 shadow-inner">
                                <DollarSign className="text-green-400" size={20} />
                                <span className="text-2xl font-mono text-white">${userData.dollars.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        <h2 className="text-xl font-bold text-cyan-400 mt-4 mb-4 flex items-center gap-2"><Wrench size={20}/> 파츠 튜닝</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-8">
                            {PART_TYPES.map(part => {
                                const currentTier = userData.parts[part.id];
                                const nextTier = currentTier + 1;
                                const currentStats = PART_STATS[currentTier];
                                const nextStats = PART_STATS[nextTier];
                                const statKey = getPartStatKey(part.id);
                                const currentVal = currentStats ? currentStats[statKey] : 0; 
                                const isMaxTier = !nextStats;

                                return (
                                    <div key={part.id} className="bg-slate-800 p-4 rounded-xl shadow-lg border-l-4 border-slate-600 hover:border-cyan-500 transition">
                                        <h3 className="text-lg font-black mb-1 uppercase text-slate-100">{part.name}</h3>
                                        <div className="text-xs text-slate-400 mb-3">{part.unit} 향상</div>
                                        
                                        <div className="flex justify-between items-center mb-2 bg-slate-900/50 px-3 py-2 rounded">
                                            <span className="text-sm text-slate-300">현재 등급</span>
                                            <span className={`font-bold ${currentTier === 3 ? 'text-yellow-400' : 'text-cyan-300'}`}>LV. {currentTier}</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-4 px-3">
                                            <span className="text-sm text-slate-300">성능 수치</span>
                                            <span className="font-mono font-bold text-white">{currentVal.toFixed(2)}</span>
                                        </div>
                                        
                                        <div className="border-t border-slate-700 pt-3">
                                            {isMaxTier ? (
                                                <div className="py-2 text-center text-sm font-bold text-slate-500 bg-slate-900 rounded">MAX LEVEL</div>
                                            ) : (
                                                <button onClick={() => purchasePart(part.id, currentTier)} className="w-full py-2 bg-cyan-600 text-white text-sm font-bold rounded hover:bg-cyan-500 transition disabled:bg-slate-700 disabled:text-slate-500 flex justify-between px-4" disabled={userData.dollars < nextStats.price}>
                                                    <span>업그레이드 (LV.{nextTier})</span>
                                                    <span>${nextStats.price.toLocaleString()}</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <h2 className="text-xl font-bold text-cyan-400 mt-2 mb-4 flex items-center gap-2"><Car size={20}/> 섀시 변경</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-10">
                            {CAR_CHASSIS.map(chassis => {
                                const isOwned = userData.ownedChassis ? userData.ownedChassis.includes(chassis.id) : chassis.id === 'C01';
                                const isEquipped = userData.currentChassis === chassis.id;
                                
                                return (
                                    <div key={chassis.id} className={`bg-slate-800 p-4 rounded-xl shadow-lg border-l-4 ${isEquipped ? 'border-yellow-400' : isOwned ? 'border-cyan-500' : 'border-slate-600'} hover:border-cyan-400 transition`}>
                                        <div className="w-full h-12 flex justify-center items-center mb-4 bg-slate-900/50 rounded-lg">
                                            <div className="w-16 h-8 rounded-md shadow-xl border border-white/20" style={{ backgroundColor: chassis.color }}></div>
                                        </div>
                                        <h3 className="text-lg font-black mb-1 text-center text-slate-100">{chassis.name}</h3>
                                        <div className="text-xs text-slate-400 text-center mb-4 font-mono">{chassis.id}</div>
                                        
                                        <div className="space-y-2 mb-4 text-sm bg-slate-900/30 p-3 rounded-lg">
                                            <div className="flex justify-between"><span className="text-slate-400">가속 기반:</span><span className="font-mono text-white">{chassis.baseAccel.toFixed(2)}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-400">접지 기반:</span><span className="font-mono text-white">{chassis.baseGrip.toFixed(2)}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-400">최속 보너스:</span><span className="font-mono text-green-400">+{chassis.maxSpeedBonus}</span></div>
                                        </div>

                                        <div className="border-t border-slate-700 pt-3">
                                            <button onClick={() => purchaseChassis(chassis.id, chassis.price)} className={`w-full py-2 text-sm font-bold rounded transition flex justify-center items-center gap-2 ${isEquipped ? 'bg-yellow-500 text-slate-900' : isOwned ? 'bg-cyan-600 text-white hover:bg-cyan-500' : 'bg-slate-700 text-white hover:bg-slate-600 disabled:opacity-50'}`} disabled={!isOwned && userData.dollars < chassis.price}>
                                                {isEquipped ? '현재 장착됨' : isOwned ? '장착하기' : `구매 ($${chassis.price.toLocaleString()})`}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const trackIdForRecord = TRACK_LAYOUTS[currentTrackIdx].id;
            const bestRecordForTrack = userData.bestRecords[trackIdForRecord];

            return (
                <div className="flex flex-col-reverse lg:flex-row h-screen bg-slate-900 text-slate-100 overflow-hidden font-sans">
                    
                    {/* 좌측 패널 */}
                    <div className="w-full lg:w-[45%] h-[55%] lg:h-full flex flex-col border-r border-slate-700 bg-[#0f172a] shadow-2xl z-20">
                        <div className="flex bg-slate-900 border-b border-slate-700">
                            <button onClick={() => setCurrentScreen('race')} className={`flex-1 py-3 font-black text-sm flex justify-center items-center gap-2 ${currentScreen === 'race' ? 'bg-[#0f172a] text-cyan-400 border-t-2 border-cyan-400' : 'text-slate-500 hover:bg-slate-800'}`}>
                                <Cpu size={18}/> LOGIC EDITOR
                            </button>
                            <button onClick={() => setCurrentScreen('shop')} className={`flex-1 py-3 font-black text-sm flex justify-center items-center gap-2 ${currentScreen === 'shop' ? 'bg-[#0f172a] text-yellow-400 border-t-2 border-yellow-400' : 'text-slate-500 hover:bg-slate-800'}`}>
                                <ShoppingCart size={18}/> GARAGE
                            </button>
                        </div>

                        {currentScreen === 'race' ? (
                            <React.Fragment>
                                <div className="p-4 bg-slate-800/50 border-b border-slate-700 flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <select className="bg-slate-900 text-cyan-400 text-sm font-bold border border-slate-600 rounded px-2 py-1 outline-none"
                                                value={currentTrackIdx} onChange={(e) => { setCurrentTrackIdx(Number(e.target.value)); }}>
                                                {TRACK_LAYOUTS.map((track, idx) => <option key={track.id} value={idx}>{track.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={resetGame} className="p-2 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 transition"><RotateCcw size={16} /></button>
                                            <button onClick={togglePlay} className={`px-4 py-2 rounded font-bold flex items-center gap-2 transition ${isPlaying ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                                                {isPlaying ? <Pause size={16}/> : <Play size={16}/>} {isPlaying ? 'STOP' : 'RUN'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900/50 px-3 py-1.5 rounded flex items-center justify-between border border-slate-700">
                                        <span className="text-xs text-slate-400 uppercase font-bold tracking-widest">최고 기록 (Best Record)</span>
                                        <span className="text-sm font-mono font-bold text-yellow-400">{bestRecordForTrack ? bestRecordForTrack.toFixed(2) + 's' : '기록 없음'}</span>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-slate-900">
                                    {userData.blocks.map((block) => {
                                        const flow = FLOW_OPTIONS.find(f => f.value === block.flowType);
                                        return (
                                        <div key={block.id} className={`bg-slate-800 p-3 rounded-lg border-l-4 ${flow?.color || 'border-slate-500'} shadow flex flex-col gap-2 group`}>
                                            <div className="flex items-center gap-2 flex-wrap pb-2 border-b border-slate-700/50">
                                                <select className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-slate-200 outline-none"
                                                    value={block.flowType} onChange={(e) => updateSingleBlock(block.id, 'flowType', e.target.value)}>
                                                    {FLOW_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                </select>

                                                {block.flowType !== 'ELSE' && (
                                                    <React.Fragment>
                                                        <select className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs text-slate-200 outline-none max-w-[140px]"
                                                            value={block.sensor} onChange={(e) => updateSingleBlock(block.id, 'sensor', parseInt(e.target.value))}>
                                                            {Object.entries(SENSOR_SELECT_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                                        </select>
                                                        
                                                        <select className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs text-slate-200 outline-none"
                                                            value={block.operator} onChange={(e) => updateSingleBlock(block.id, 'operator', e.target.value)}>
                                                            {OPERATOR_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                        </select>
                                                        
                                                        <button onClick={() => toggleValueType(block.id)} 
                                                            className="p-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 transition" 
                                                            title="숫자/센서 변경">
                                                            {block.valueType === 'number' ? <Hash size={14}/> : <Radar size={14}/>}
                                                        </button>

                                                        {block.valueType === 'number' ? (
                                                            <input type="number" className="bg-slate-900 border border-slate-600 rounded w-16 px-2 py-1 text-xs text-slate-200 outline-none"
                                                                value={block.value} onChange={(e) => updateSingleBlock(block.id, 'value', parseInt(e.target.value)||0)} />
                                                        ) : (
                                                            <div className="flex items-center gap-1">
                                                                <select className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs text-slate-200 outline-none max-w-[120px]"
                                                                    value={block.value} onChange={(e) => updateSingleBlock(block.id, 'value', parseInt(e.target.value))}>
                                                                    {Object.entries(SENSOR_SELECT_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                                                </select>
                                                                <span className="text-slate-500 text-xs mx-1">x</span>
                                                                <div className="relative">
                                                                    <input type="number" className="bg-slate-900 border border-slate-600 rounded w-14 pl-1 pr-4 py-1 text-xs text-right text-slate-200 outline-none"
                                                                        value={block.multiplier || 100} onChange={(e) => updateSingleBlock(block.id, 'multiplier', parseInt(e.target.value)||0)} />
                                                                    <span className="absolute right-1 top-1 text-[9px] text-slate-500">%</span>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </React.Fragment>
                                                )}
                                                <button onClick={() => updateBlocks(userData.blocks.filter(b => b.id !== block.id))} className="text-slate-500 hover:text-rose-400 p-1 ml-auto"><Trash2 size={16} /></button>
                                            </div>
                                            
                                            <div className="flex flex-col gap-2 pt-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-slate-500 font-bold text-xs">THEN →</span>
                                                    <select className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-cyan-300 outline-none flex-1"
                                                        value={block.actionType} onChange={(e) => updateSingleBlock(block.id, 'actionType', e.target.value)}>
                                                        {ACTION_TYPES.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                    </select>
                                                </div>

                                                {block.actionType !== 'AUTO_STEER' && (
                                                    <div className="flex items-center gap-2 bg-black/20 p-2 rounded ml-14">
                                                        <span className="text-[10px] text-slate-400 font-bold w-10 text-right">
                                                            {block.actionType === 'STEER' ? '좌 -100' : '감속 -100'}
                                                        </span>
                                                        <input 
                                                            type="range" min="-100" max="100" step="5"
                                                            value={block.actionValue}
                                                            onChange={(e) => updateSingleBlock(block.id, 'actionValue', parseInt(e.target.value))}
                                                            className="flex-1 accent-cyan-500" 
                                                        />
                                                        <span className="text-[10px] text-slate-400 font-bold w-10">
                                                            {block.actionType === 'STEER' ? '우 +100' : '가속 +100'}
                                                        </span>
                                                        <div className="relative ml-2">
                                                            <input type="number" className="bg-slate-900 border border-slate-600 rounded w-16 pl-2 pr-4 py-1 text-xs font-mono text-right text-slate-200 outline-none"
                                                                value={block.actionValue} onChange={(e) => updateSingleBlock(block.id, 'actionValue', parseInt(e.target.value)||0)} />
                                                            <span className="absolute right-1.5 top-1.5 text-[9px] text-slate-500">%</span>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )})}
                                </div>
                                
                                <div className="p-3 bg-slate-800 border-t border-slate-700">
                                    <button onClick={() => updateBlocks([...userData.blocks, { id: Date.now(), flowType: 'IF', sensor: 0, operator: '>', valueType: 'sensor', value: 6, multiplier: 100, actionType: 'STEER', actionValue: 50 }])} 
                                        className="w-full py-3 border border-dashed border-slate-500 text-slate-400 rounded hover:border-cyan-400 hover:text-cyan-400 transition text-sm font-bold flex justify-center items-center gap-2">
                                        <Plus size={18} /> 새 조건 추가
                                    </button>
                                </div>
                            </React.Fragment>
                        ) : (
                            <ShopScreen />
                        )}
                    </div>

                    {/* 우측 시뮬레이션 화면 */}
                    <div className="w-full lg:flex-1 h-[45%] lg:h-full relative bg-[#020617] p-4 flex flex-col items-center justify-center">
                        
                        {/* 상단 레이스 및 센서 현황 */}
                        <div className="absolute top-4 left-6 right-6 flex justify-between z-10 pointer-events-none">
                            <div className="flex gap-2">
                                {cars.current.map((c, i) => (
                                    <div key={c.id} className="bg-slate-900/80 backdrop-blur border border-slate-700 p-2 rounded flex flex-col items-center min-w-[50px]">
                                        <div className="w-3 h-3 rounded-full mb-1" style={{backgroundColor: c.color}}></div>
                                        <span className="font-mono text-xs font-bold text-white">{c.laps}/{TOTAL_LAPS}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-2 opacity-90">
                                <div className="bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-2 rounded flex flex-col items-end">
                                    <span className="text-[9px] text-cyan-400 uppercase">Speed</span>
                                    <span className="text-sm font-mono font-bold text-white">{(sensorReadings[7] || 0).toFixed(0)}</span>
                                </div>
                                <div className="bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-2 rounded flex flex-col items-end">
                                    <span className="text-[9px] text-yellow-400 uppercase">Curve</span>
                                    <span className="text-sm font-mono font-bold text-white">{(sensorReadings[9] || 0).toFixed(0)}°</span>
                                </div>
                            </div>
                        </div>

                        {/* 신규: 랩타임 히스토리 (좌측 하단) */}
                        {currentScreen === 'race' && (
                            <div className="absolute bottom-6 left-6 z-10 bg-slate-900/80 backdrop-blur p-3 rounded-lg border border-slate-700 shadow-xl min-w-[140px] pointer-events-none">
                                <div className="text-[10px] text-slate-400 uppercase border-b border-slate-700 pb-1 mb-2 tracking-widest font-bold">Lap Times</div>
                                {[...Array(TOTAL_LAPS)].map((_, i) => (
                                    <div key={i} className="flex justify-between items-center text-xs font-mono mb-1">
                                        <span className={userStats.laps === i ? 'text-yellow-400' : 'text-slate-500'}>LAP {i+1}</span>
                                        <span className={userStats.laps === i ? 'text-white' : 'text-slate-400'}>
                                            {userStats.lapHistory[i] ? userStats.lapHistory[i].toFixed(2) + 's' : (userStats.laps === i && isPlaying ? userStats.currentLapTime.toFixed(2) + 's' : '--.--')}
                                        </span>
                                    </div>
                                ))}
                                <div className="border-t border-slate-700 mt-2 pt-2 flex justify-between text-xs font-mono font-bold text-cyan-400">
                                    <span>TOTAL</span>
                                    <span>{userStats.totalTime.toFixed(2)}s</span>
                                </div>
                            </div>
                        )}

                        <canvas ref={canvasRef} width={TRACK_WIDTH} height={TRACK_HEIGHT} className="rounded-2xl shadow-2xl max-w-full max-h-full object-contain" />
                        
                        {gameState === 'finished' && (
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 px-10 py-8 rounded-3xl border border-slate-700 shadow-2xl flex flex-col items-center gap-4 min-w-[300px] z-30">
                                <Flag size={48} className={userRank === 1 ? 'text-yellow-400' : 'text-slate-400'} />
                                <h2 className="text-3xl font-black text-white text-center">
                                    {userRank}위 마감!
                                </h2>
                                <div className="bg-slate-800 w-full py-3 rounded text-center mb-2 border border-slate-600">
                                    <span className="text-slate-400 text-sm">상금 획득</span>
                                    <div className="text-2xl font-mono text-green-400 font-bold">
                                        +${(userRank === 1 ? 3000 : userRank === 2 ? 1500 : userRank === 3 ? 800 : 200).toLocaleString()}
                                    </div>
                                </div>
                                <button onClick={resetGame} className="w-full py-3 bg-cyan-600 text-white rounded-lg font-bold hover:bg-cyan-500 transition text-lg shadow-lg pointer-events-auto">
                                    다음 레이스 준비
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
