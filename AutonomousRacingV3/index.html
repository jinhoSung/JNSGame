                blocks: INITIAL_BLOCKS,
                physics: getPhysicsConstants(getDefaultUserData().parts, CAR_CHASSIS[0].id),

            const cars = useRef([]);
            const requestRef = useRef();

            const uiUpdateThrottleRef = useRef(0);
            const raceStandings = useRef([]);

                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        let parsedData = JSON.parse(stored);
                        
                        if (!parsedData.parts) parsedData.parts = getDefaultUserData().parts;
                        if (!parsedData.parts.brakes) parsedData.parts.brakes = 0;
                        if (!parsedData.activeParts) parsedData.activeParts = JSON.parse(JSON.stringify(parsedData.parts)); 
                        if (!parsedData.ownedChassis) parsedData.ownedChassis = ['C01'];
                        if (!parsedData.bestRecords) parsedData.bestRecords = {};
                        if (!parsedData.blocks) parsedData.blocks = INITIAL_BLOCKS;
                        if (!parsedData.savedLogics) parsedData.savedLogics = [];
                        
                        setUserData(parsedData);
                        
                        activeConfigRef.current = {
                            blocks: parsedData.blocks,
                            physics: getPhysicsConstants(parsedData.activeParts, parsedData.currentChassis),
                            trackIdx: 0
                        };
                    }
                } catch (e) { console.error(e); }
                initializeCars();
            }, []);

            const saveLocalData = (data) => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
            };

            const updateBlocks = (newBlocks) => {
                const newData = { ...userData, blocks: newBlocks };
                setUserData(newData);
                saveLocalData(newData);
            };

            const updateSingleBlock = (id, field, value) => {
                const newBlocks = userData.blocks.map(b => b.id === id ? { ...b, [field]: value } : b);
                updateBlocks(newBlocks);
            };

            const toggleValueType = (id) => {
                const newBlocks = userData.blocks.map(b => {
                    if (b.id === id) {
                        const newType = b.valueType === 'number' ? 'sensor' : 'number';
                        const newValue = newType === 'number' ? 50 : 0; 
                        return { ...b, valueType: newType, value: newValue };
                    }
                    return b;
                });
                updateBlocks(newBlocks);
            };

            const handleSavePreset = () => {
                const name = presetNameInput.trim();
                if (!name) return;
                
                const newLogic = {
                    id: Date.now().toString(),
                    name: name,
                    blocks: JSON.parse(JSON.stringify(userData.blocks))
                };
                const newData = { ...userData, savedLogics: [...(userData.savedLogics || []), newLogic] };
                setUserData(newData);
                saveLocalData(newData);
                setSelectedPresetId(newLogic.id);
                setPresetNameInput(""); 
            };

            const handleLoadPreset = () => {
                if (!selectedPresetId) return;
                const target = userData.savedLogics.find(l => l.id === selectedPresetId);
                if (target) {
                    updateBlocks(JSON.parse(JSON.stringify(target.blocks)));
                }
            };

            const handleDeletePreset = () => {
                if (!selectedPresetId) return;
                const newData = { ...userData, savedLogics: userData.savedLogics.filter(l => l.id !== selectedPresetId) };
                setUserData(newData);
                saveLocalData(newData);
                setSelectedPresetId("");
            };

            const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            
            const scalePoint = useCallback((p) => ({
                x: (p.x - TRACK_WIDTH / 2) * MAP_SCALE + TRACK_WIDTH / 2,
                y: (p.y - TRACK_HEIGHT / 2) * MAP_SCALE + TRACK_HEIGHT / 2
            }), []);
            
            const getCurrentTrackPoints = useCallback(() => {
                const idx = activeConfigRef.current.trackIdx;
                return TRACK_LAYOUTS[idx].points.map(scalePoint);
            }, [scalePoint]);

            const isOffTrack = (x, y) => {
                const points = getCurrentTrackPoints();
                let minDist = Infinity;
                for (let i = 0; i < points.length; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % points.length];
                    const d = distToSegment(x, y, p1.x, p1.y, p2.x, p2.y);
                    if (d < minDist) minDist = d;
                }
                return minDist > (TRACK_AESTHETICS.curb / 2) + 3; 
            };

            const distToSegment = (x, y, x1, y1, x2, y2) => {
                const A = x - x1, B = y - y1, C = x2 - x1, D = y2 - y1;
                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;
                let xx, yy;
                if (param < 0) { xx = x1; yy = y1; }
                else if (param > 1) { xx = x2; yy = y2; }
                else { xx = x1 + param * C; yy = y1 + param * D; }
                return dist(x, y, xx, yy);
            };

            const getTrackSensorData = (car) => {
                const points = getCurrentTrackPoints();
                const len = points.length;
                
                const candidateIndices = [car.lastCP % len, (car.lastCP + 1) % len];
                let minDist = Infinity;
                let closestSegmentIdx = 0;
                let projX = 0, projY = 0;

                for (let i = 0; i < len; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % len];

                    const C = p2.x - p1.x;
                    const D = p2.y - p1.y;
                    const dot = (car.x - p1.x) * C + (car.y - p1.y) * D;
                    const lenSq = C * C + D * D;
                    let param = -1;
                    if (lenSq !== 0) param = dot / lenSq;

                    param = Math.max(0, Math.min(1, param));

                    const px = p1.x + param * C;
                    const py = p1.y + param * D;

                    const d = dist(car.x, car.y, px, py);
                    if (d < minDist) {
                        minDist = d;
                        closestSegmentIdx = i;
                        projX = px;
                        projY = py;
                    }
                }

                const p1 = points[closestSegmentIdx];
                const p2 = points[(closestSegmentIdx + 1) % len];

                const C = p2.x - p1.x;
                const D = p2.y - p1.y;
                const crossProduct = C * (car.y - p1.y) - D * (car.x - p1.x);
                const segmentLen = Math.sqrt(C * C + D * D) || 1;
                
                const cte = (crossProduct / segmentLen);
                const currentTrackAngle = Math.atan2(D, C);

                let lookaheadDist = 120;
                let currentSegIdx = closestSegmentIdx;
                let distToEndOfCurrentSeg = dist(projX, projY, p2.x, p2.y);

                let futureTrackAngle = currentTrackAngle;

                if (lookaheadDist > distToEndOfCurrentSeg) {
                    let remainingDist = lookaheadDist - distToEndOfCurrentSeg;
                    let nextSegIdx = (currentSegIdx + 1) % len;
                    let pNext1 = points[nextSegIdx];
                    let pNext2 = points[(nextSegIdx + 1) % len];
                    let nextSegLen = dist(pNext1.x, pNext1.y, pNext2.x, pNext2.y) || 1;

                    let maxIters = len + 2; 
                    while (remainingDist > nextSegLen && maxIters > 0) {
                        remainingDist -= nextSegLen;
                        nextSegIdx = (nextSegIdx + 1) % len;
                        pNext1 = points[nextSegIdx];
                        pNext2 = points[(nextSegIdx + 1) % len];
                        nextSegLen = dist(pNext1.x, pNext1.y, pNext2.x, pNext2.y) || 1;
                        maxIters--;
                    }
                    futureTrackAngle = Math.atan2(pNext2.y - pNext1.y, pNext2.x - pNext1.x);
                }

                let curveDiff = futureTrackAngle - currentTrackAngle;
                while (curveDiff <= -Math.PI) curveDiff += Math.PI * 2;
                while (curveDiff > Math.PI) curveDiff -= Math.PI * 2;

                const curveAngleDeg = curveDiff * (180 / Math.PI);

                let angleErr = currentTrackAngle - car.angle;
                while(angleErr <= -Math.PI) angleErr += Math.PI * 2;
                while(angleErr > Math.PI) angleErr -= Math.PI * 2;

                return { cte, targetAngle: currentTrackAngle, curveAngleDeg, angleErrDeg: angleErr * (180 / Math.PI) };
            };

            const castRays = (car, range) => {
                const readings = [];
                SENSOR_ANGLES.forEach(offset => {
                    const rayAngle = car.angle + (offset * Math.PI / 180);
                    let distance = 0;
                    let step = 5; 
                    let rx = car.x, ry = car.y;
                    while (distance < range) {
                        rx += Math.cos(rayAngle) * step;
                        ry += Math.sin(rayAngle) * step;
                        distance += step;
                        if (isOffTrack(rx, ry)) break;
                    }
                    readings.push(Math.min(distance, range));
                });
                return readings;
            };

            const updateCarPhysics = (car, inputs, dt) => {
                if (car.finished || car.failed) return;

                const carPhysics = car.isAI ? getAIPhysicsConstants(car.aiTier) : activeConfigRef.current.physics;
                
                if (Math.abs(car.speed) > 0.5) {
                    car.angle += inputs.steer * carPhysics.turnSpeed * (car.speed > 0 ? 1 : -1);
                }

                if (car.moveAngle === undefined) car.moveAngle = car.angle;
                if (car.skidMarks === undefined) car.skidMarks = [];

                const speedRatio = Math.abs(car.speed) / (carPhysics.maxSpeed || 1); 
                const grip = carPhysics.gripFactor + (1.0 - speedRatio) * (1 - carPhysics.gripFactor); 

                let angleDiff = car.angle - car.moveAngle;
                while (angleDiff <= -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

                car.moveAngle += angleDiff * grip;
                
                let actualThrottle = inputs.throttle;
                if (actualThrottle > 0) {
                    if (car.speed < -0.1) {
                        car.speed += actualThrottle * carPhysics.brakePower; 
                        if (car.speed > 0) car.speed = 0;
                    } else {
                        car.speed += actualThrottle * carPhysics.acceleration;
                    }
                } else if (actualThrottle < 0) {
                    if (car.speed > 0.1) {
                        car.speed += actualThrottle * carPhysics.brakePower;
                        if (car.speed < 0) car.speed = 0;
                    } else {
                        car.speed += actualThrottle * carPhysics.acceleration * 0.5; 
                    }
                }

                car.speed *= carPhysics.friction;

                const driftIntensity = Math.abs(angleDiff);
                if (driftIntensity > 0.15 && Math.abs(car.speed) > 3) {
                    car.speed *= (1 - driftIntensity * 0.05);
                    const rearX = car.x - Math.cos(car.angle) * 10, rearY = car.y - Math.sin(car.angle) * 10;
                    const perp = car.angle + Math.PI/2;
                    car.skidMarks.push({ 
                        lx: rearX + Math.cos(perp)*6, ly: rearY + Math.sin(perp)*6, 
                        rx: rearX - Math.cos(perp)*6, ry: rearY - Math.sin(perp)*6 
                    });
                    if (car.skidMarks.length > MAX_SKID_MARKS) car.skidMarks.shift(); 
                }

                if (car.speed > carPhysics.maxSpeed) car.speed = carPhysics.maxSpeed;
                if (car.speed < -carPhysics.maxSpeed / 2) car.speed = -carPhysics.maxSpeed / 2;

                car.x += Math.cos(car.moveAngle) * car.speed;
                car.y += Math.sin(car.moveAngle) * car.speed;

                if (isOffTrack(car.x, car.y)) car.speed *= 0.8; 

                car.activeTime = (car.activeTime || 0) + dt;

                if (car.id === 'user') {
                    if (Math.abs(car.speed) < 1.0) {
                        car.stuckTimer = (car.stuckTimer || 0) + dt;
                    } else {
                        car.stuckTimer = 0;
                    }

                    const currentLapDuration = car.activeTime - car.lapStartTime;
                    
                    if (car.stuckTimer > 3.0 || currentLapDuration > 30.0) {
                        car.failed = true;
                        setGameState('failed');
                        return; 
                    }
                }

                const points = getCurrentTrackPoints();
                const nextCpIdx = (car.lastCP + 1) % points.length;
                const nextCp = points[nextCpIdx];
                
                let isReached = false;
                if (nextCpIdx === 0) {
                    const trackAngle = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
                    const localX = (car.x - points[0].x) * Math.cos(-trackAngle) - (car.y - points[0].y) * Math.sin(-trackAngle);
                    const localY = (car.x - points[0].x) * Math.sin(-trackAngle) + (car.y - points[0].y) * Math.cos(-trackAngle);
                    if (Math.abs(localX) < 20 && Math.abs(localY) < 45) isReached = true;
                } else {
                    if (dist(car.x, car.y, nextCp.x, nextCp.y) < CHECKPOINT_RADIUS_NORMAL) isReached = true;
                }

                if (isReached) {
                    car.lastCP = nextCpIdx;
                    if (nextCpIdx === 0) {
                        car.laps++;
                        
                        const lapTime = car.activeTime - car.lapStartTime;
                        car.lastLapTime = lapTime;
                        car.lapStartTime = car.activeTime; 
                        
                        if (car.id === 'user') {
                            if (!car.lapHistory) car.lapHistory = [];
                            car.lapHistory.push(lapTime);
                        }

                        if (car.laps >= TOTAL_LAPS) {
                            car.finished = true;
                            car.finishTime = car.activeTime;
                            
                            if (!raceStandings.current.includes(car.id)) {
                                raceStandings.current.push(car.id);
                            }
                            
                            if (car.id === 'user') {
                                const rank = raceStandings.current.findIndex(id => id === 'user') + 1;
                                setUserRank(rank);
                                
                                setUserData(prevData => {
                                    const trackObj = TRACK_LAYOUTS[activeConfigRef.current.trackIdx];
                                    let newBestRecords = { ...prevData.bestRecords };
                                    if (!newBestRecords[trackObj.id] || car.finishTime < newBestRecords[trackObj.id]) {
                                        newBestRecords[trackObj.id] = car.finishTime;
                                    }

                                    const baseReward = rank === 1 ? 3000 : rank === 2 ? 1500 : rank === 3 ? 800 : 200;
                                    const finalReward = Math.round(baseReward * trackObj.multiplier);

                                    const newData = {
                                        ...prevData, 
                                        dollars: prevData.dollars + finalReward,
                                        bestRecords: newBestRecords
                                    };
                                    saveLocalData(newData);
                                    return newData;
                                });

                                setGameState('finished');
                            }
                        }
                    }
                }
            };

            const evaluateCondition = (block, sensorDataObj) => {
                if (block.flowType === 'ELSE') return false; 
                
                let leftValue = sensorDataObj[block.sensor] || 0;
                let rightValue = block.valueType === 'sensor' 
                    ? (sensorDataObj[block.value] || 0) * ((block.multiplier || 100) / 100) 
                    : block.value;

                switch(block.operator) {
                    case '<': return leftValue < rightValue;
                    case '>': return leftValue > rightValue;
                    case '<=': return leftValue <= rightValue;
                    case '>=': return leftValue >= rightValue;
                    case '==': return leftValue === rightValue;
                    case '!=': return leftValue !== rightValue;
                    default: return false;
                }
            };
            
            const applyAction = (block, steerOutputs, car, trackData) => {
                switch(block.actionType) {
                    case 'AUTO_STEER':
                        // 조절값(0~100)을 조향 강도 수치로 사용
                        const steerMag = Math.abs(block.actionValue || 0) / 100;
                        
                        // 우측 이탈(+)일 때는 좌측(-) 조향, 좌측 이탈(-)일 때는 우측(+) 조향을 적용
                        const steerSign = trackData.cte > 0 ? -1 : (trackData.cte < 0 ? 1 : 0);
                        
                        // Bang-Bang 진동 현상을 막기 위해 차선과 가까워지면 조향력을 부드럽게 감쇠
                        const errorRatio = Math.min(Math.abs(trackData.cte) / 20, 1.0);
                        
                        const cteCorrection = steerSign * steerMag * errorRatio;

                        // 차량이 트랙 커브를 돌 수 있도록 기본 각도 보정(angleErr)에 유저의 CTE 보정값을 더함
                        let angleErr = trackData.targetAngle - car.angle;
                        while(angleErr <= -Math.PI) angleErr += Math.PI * 2;
                        while(angleErr > Math.PI) angleErr -= Math.PI * 2;
                        
                        const finalSteer = (angleErr * 0.8) + cteCorrection;
                        steerOutputs.steer = Math.max(-1, Math.min(1, finalSteer * 2.5)); 
                        break;
                    case 'STEER':
                        steerOutputs.steer = Math.max(-1, Math.min(1, (block.actionValue || 0) / 100));
                        break;
                    case 'THROTTLE':
                        steerOutputs.throttle = Math.max(-1, Math.min(1, (block.actionValue || 0) / 100));
                        break;
                }
            }

            const getUserInputs = (car) => {
                const steerOutputs = { steer: 0, throttle: 0 }; 
                
                const rayReadings = castRays(car, activeConfigRef.current.physics.sensorRange);
                const trackData = getTrackSensorData(car);
                
                const sensorDataObj = {
                    0: rayReadings[0], 1: rayReadings[1], 2: rayReadings[2], 3: rayReadings[3],
                    4: rayReadings[4], 5: rayReadings[5], 6: rayReadings[6],
                    [SENSOR_SPEED_ID]: Math.abs(car.speed) * 10,
                    [SENSOR_CTE_ID]: Math.abs(trackData.cte), // 조건 판단용 절대값 반환
                    [SENSOR_CURVE_ID]: trackData.curveAngleDeg
                };

                uiUpdateThrottleRef.current++;
                if (uiUpdateThrottleRef.current % 5 === 0) {
                    setSensorReadings(sensorDataObj);
                }

                let matchedInChain = false; 
                for (let i = 0; i < activeConfigRef.current.blocks.length; i++) {
                    const block = activeConfigRef.current.blocks[i];
                    const conditionMet = evaluateCondition(block, sensorDataObj);
                    const isStart = block.flowType === 'IF';
                    
                    if (isStart) matchedInChain = false;

                    if ((isStart && conditionMet) || (block.flowType === 'ELSE_IF' && !matchedInChain && conditionMet) || (block.flowType === 'ELSE' && !matchedInChain)) {
                        applyAction(block, steerOutputs, car, trackData);
                        matchedInChain = true; 
                    }
                }
                return steerOutputs;
            };

            const getAIInputs = (car) => {
                const trackData = getTrackSensorData(car);
                let angleErr = trackData.targetAngle - car.angle;
                while(angleErr <= -Math.PI) angleErr += Math.PI * 2;
                while(angleErr > Math.PI) angleErr -= Math.PI * 2;
                
                const brave = car.braveFactor || 1.0;
                const steerFactor = car.steerFactor || 1.0;

                const speedRatio = Math.max(Math.abs(car.speed) / 20, 0.5);
                const cteCorrection = (-trackData.cte * 0.05 * steerFactor) / speedRatio;
                const angleErrRad = trackData.angleErrDeg * (Math.PI / 180);
                const steer = Math.max(-1, Math.min(1, (angleErrRad * 0.9 + cteCorrection) * 2.5));

                let throttle = 1.0;
                
                const brakingPoint = 40 * brave;
                const absCurve = Math.abs(trackData.curveAngleDeg);

                if (absCurve > brakingPoint) {
                    throttle = -1.0; 
                } else if (absCurve > brakingPoint * 0.5) {
                    throttle = 0.0;
                }

                const rayReadings = castRays(car, 150);
                if (rayReadings[3] < 80 * brave) throttle = -1.0;
                
                return { steer, throttle };
            };

            const update = (timestamp) => {
                if (lastFrameTimeRef.current === 0) lastFrameTimeRef.current = timestamp;
                const dt = Math.min((timestamp - lastFrameTimeRef.current) / 1000, 0.1);
                lastFrameTimeRef.current = timestamp;

                if (gameState === 'finished' || gameState === 'failed') {
                    if (autoRun) {
                        const userCar = cars.current.find(c => c.id === 'user');
                        if (userCar) {
                            userCar.restartTimer = (userCar.restartTimer || 0) + dt;
                            if (userCar.restartTimer > 3.0) { 
                                applyConfigAndRestart();
                            }
                        }
                    }
                    draw();
                    if (autoRun || gameState !== 'idle') requestRef.current = requestAnimationFrame(update);
                    return;
                }
                
                const userCar = cars.current.find(c => c.id === 'user');
                if (!userCar || cars.current.length === 0) return;

                const userInputs = getUserInputs(userCar);
                updateCarPhysics(userCar, userInputs, dt);
                
                cars.current.filter(c => c.id !== 'user').forEach(car => updateCarPhysics(car, getAIInputs(car), dt));

                if (uiUpdateThrottleRef.current % 5 === 0) {
                    setUserStats(prev => ({
                        ...prev, 
                        laps: userCar.laps || 0,
                        currentLapTime: userCar.activeTime - userCar.lapStartTime,
                        lastLapTime: userCar.lastLapTime || 0,
                        totalTime: userCar.finished ? userCar.finishTime : userCar.activeTime,
                        lapHistory: userCar.lapHistory || [] 
                    }));
                }

                draw();
                if (autoRun || gameState === 'running') {
                    requestRef.current = requestAnimationFrame(update);
                }
            };

            const draw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#1e293b'; 
                ctx.fillRect(0, 0, TRACK_WIDTH, TRACK_HEIGHT);

                if (cars.current.length === 0) return;
                const points = getCurrentTrackPoints();
                
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = TRACK_AESTHETICS.border;
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();

                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = TRACK_AESTHETICS.curb; ctx.stroke();
                ctx.strokeStyle = '#334155'; ctx.lineWidth = TRACK_AESTHETICS.asphalt; ctx.stroke();

                ctx.strokeStyle = '#fbbf24'; 
                ctx.lineWidth = 3;
                ctx.setLineDash([15, 15]); 
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
                ctx.setLineDash([]);

                cars.current.forEach(car => {
                    if (car.skidMarks && car.skidMarks.length > 1) {
                        ctx.lineWidth = 4; ctx.strokeStyle = `rgba(10, 10, 10, 0.4)`; 
                        for(let i=0; i<car.skidMarks.length-1; i++) {
                            const p1 = car.skidMarks[i], p2 = car.skidMarks[i+1];
                            ctx.beginPath(); ctx.moveTo(p1.lx, p1.ly); ctx.lineTo(p2.lx, p2.ly); ctx.stroke();
                            ctx.beginPath(); ctx.moveTo(p1.rx, p1.ry); ctx.lineTo(p2.rx, p2.ry); ctx.stroke();
                        }
                    }
                });

                const startAngle = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
                ctx.save(); ctx.translate(points[0].x, points[0].y); ctx.rotate(startAngle); 
                ctx.fillStyle = '#fff'; ctx.fillRect(-10, -40, 20, 80); 
                ctx.fillStyle = '#000';
                for(let i=0; i<8; i++) for(let j=0; j<2; j++) if((i+j)%2===0) ctx.fillRect(-10 + j*10, -40 + i*10, 10, 10);
                ctx.restore();

                cars.current.forEach(car => {
                    if (!car || isNaN(car.x) || isNaN(car.y)) return;
                    
                    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
                    ctx.fillStyle = car.color; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
                    ctx.fillRect(-CAR_SIZE.width/2, -CAR_SIZE.height/2, CAR_SIZE.width, CAR_SIZE.height);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(2, -5, 6, 10);
                    
                    if (car.id === 'user') {
                        ctx.strokeStyle = '#22d3ee'; 
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#06b6d4';
                        ctx.shadowBlur = 10;
                        ctx.strokeRect(-CAR_SIZE.width/2 - 4, -CAR_SIZE.height/2 - 4, CAR_SIZE.width + 8, CAR_SIZE.height + 8);
                    }
                    ctx.restore();

                    if (car.id === 'user') {
                        ctx.fillStyle = '#22d3ee';
                        ctx.font = '900 12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = 'rgba(0,0,0,0.8)';
                        ctx.shadowBlur = 4;
                        ctx.fillText('PLAYER', car.x, car.y - 20);
                        ctx.shadowBlur = 0; 
                    }
                });
            };

            const applyConfigAndRestart = useCallback(() => {
                activeConfigRef.current = {
                    blocks: JSON.parse(JSON.stringify(userData.blocks)),
                    physics: getPhysicsConstants(userData.activeParts, userData.currentChassis),
                    trackIdx: uiTrackIdx

                const px = Math.cos(startAngle + Math.PI/2), py = Math.sin(startAngle + Math.PI/2);
                const dx = Math.cos(startAngle), dy = Math.sin(startAngle);

                const baseTier = Math.min(12, Math.floor(trackMultiplier * 2.5)); 

                const newCars = [
                    { id: 'user', x: spawnX, y: spawnY, angle: startAngle, moveAngle: startAngle, speed: 0, color: userChassis.color, chassisId: userChassis.id, isAI: false, laps: 0, lastCP: 0, finished: false, failed: false, activeTime: 0, lapStartTime: 0, lapHistory: [], skidMarks: [] }
                ];

                    const aiTier = Math.min(15, baseTier + Math.floor(Math.random() * 3));
                    const braveFactor = 0.7 + Math.random() * 0.6; 
                    const steerFactor = 0.8 + Math.random() * 0.4; 
                    
                    newCars.push({
                        id: `ai${i+1}`,
                        x: spawnX - dx * (i + 1) * 25, 
                        y: spawnY - dy * (i + 1) * 25,
                        angle: startAngle, moveAngle: startAngle, speed: 0, color: aiColors[i], isAI: true, laps: 0, lastCP: 0, finished: false, activeTime: 0, lapStartTime: 0, skidMarks: [],

                raceStandings.current = [];

                setGameState('running');
                setUserStats({ laps: 0, currentLapTime: 0, lastLapTime: 0, totalTime: 0, lapHistory: [] });

                        ) : renderShopScreen()}
                    </div>

                    <div className="w-full lg:flex-1 h-[45%] lg:h-full relative bg-[#020617] p-4 flex flex-col items-center justify-center">
                        
                        <div className="absolute top-4 left-6 right-6 flex justify-between z-10 pointer-events-none">
                            <div className="flex gap-2">
                                {cars.current.map((c, i) => (
                                    <div key={c.id} className="bg-slate-900/80 backdrop-blur border border-slate-700 p-2 rounded flex flex-col items-center min-w-[50px]">
                                        <div className="w-3 h-3 rounded-full mb-1" style={{backgroundColor: c.color}}></div>
                                        <span className="font-mono text-xs font-bold text-white">{c.laps}/{TOTAL_LAPS}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-2 opacity-90">
                                <div className="bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-2 rounded flex flex-col items-end">
                                    <span className="text-[9px] text-cyan-400 uppercase">속도</span>
                                    <span className="text-sm font-mono font-bold text-white">{(sensorReadings[99] || 0).toFixed(0)}</span>
                                </div>
                                <div className="bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-2 rounded flex flex-col items-end">
                                    <span className="text-[9px] text-yellow-400 uppercase">전방 커브</span>
                                    <span className="text-sm font-mono font-bold text-white">{(sensorReadings[101] || 0).toFixed(0)}°</span>
                                </div>
                            </div>
                        </div>

                        {currentScreen === 'race' && (
                            <div className="absolute bottom-6 left-6 z-10 bg-slate-900/80 backdrop-blur p-3 rounded-lg border border-slate-700 shadow-xl min-w-[140px] pointer-events-none">
                                <div className="text-[10px] text-slate-400 uppercase border-b border-slate-700 pb-1 mb-2 tracking-widest font-bold">랩타임 기록</div>
                                {[...Array(TOTAL_LAPS)].map((_, i) => (
                                    <div key={i} className="flex justify-between items-center text-xs font-mono mb-1">
                                        <span className={userStats.laps === i ? 'text-yellow-400' : 'text-slate-500'}>바퀴 {i+1}</span>
                                        <span className={userStats.laps === i ? 'text-white' : 'text-slate-400'}>
                                            {userStats.lapHistory[i] ? userStats.lapHistory[i].toFixed(2) + 's' : (userStats.laps === i && (gameState === 'running' || autoRun) ? userStats.currentLapTime.toFixed(2) + 's' : '--.--')}
                                        </span>
                                    </div>
                                ))}
                                <div className="border-t border-slate-700 mt-2 pt-2 flex justify-between text-xs font-mono font-bold text-cyan-400">
                                    <span>총합</span>
                                    <span>{userStats.totalTime.toFixed(2)}s</span>
                                </div>
                            </div>
                        )}

                        {gameState === 'failed' && (
                            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-red-900/80 text-red-200 px-4 py-2 rounded shadow-lg text-sm font-bold z-20 animate-pulse">
                                차량이 정지했거나 제한 시간을 초과하여 실격되었습니다! {autoRun ? '(재시작 중...)' : ''}
                            </div>
                        )}

                        <canvas ref={canvasRef} width={TRACK_WIDTH} height={TRACK_HEIGHT} className="rounded-2xl shadow-2xl max-w-full max-h-full object-contain" />
                        
                        {gameState === 'finished' && (
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 px-10 py-8 rounded-3xl border border-slate-700 shadow-2xl flex flex-col items-center gap-4 min-w-[300px] z-30">
                                <Flag size={48} className={userRank === 1 ? 'text-yellow-400' : 'text-slate-400'} />
                                <h2 className="text-3xl font-black text-white text-center">
                                    {userRank}위 마감!
                                </h2>
                                <div className="bg-slate-800 w-full py-3 rounded text-center mb-2 border border-slate-600">
                                    <span className="text-slate-400 text-sm">상금 획득 (x{TRACK_LAYOUTS[activeConfigRef.current.trackIdx].multiplier} 적용)</span>
                                    <div className="text-2xl font-mono text-green-400 font-bold">
                                        +${(Math.round((userRank === 1 ? 3000 : userRank === 2 ? 1500 : userRank === 3 ? 800 : 200) * TRACK_LAYOUTS[activeConfigRef.current.trackIdx].multiplier)).toLocaleString()}
                                    </div>
                                </div>
                                {!autoRun && (
                                    <button onClick={applyConfigAndRestart} className="w-full py-3 bg-cyan-600 text-white rounded-lg font-bold hover:bg-cyan-500 transition text-lg shadow-lg pointer-events-auto">
                                        다음 레이스 수동 시작
                                    </button>
                                )}
                                {autoRun && (
                                    <div className="text-sm text-slate-400 animate-pulse">잠시 후 다음 레이스가 자동 시작됩니다...</div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
